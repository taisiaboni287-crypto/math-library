<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Площадь трапеции</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f6fb;color:#203b58;font:17px system-ui}main{max-width:780px;margin:24px auto;padding:22px}header,section{background:white;border:1px solid #dce7f1;border-radius:24px;padding:26px;margin-bottom:18px}small{color:#587a9a}h1{font-size:clamp(25px,5vw,38px);margin:12px 0}h2{font-size:23px}button{font:inherit;cursor:pointer;border:1px solid #cbddeb;border-radius:12px;padding:14px;background:#f6faff;color:#203b58}button:hover{background:#e4eff9}button:disabled{cursor:default} .opt{display:block;width:100%;text-align:left;margin:9px 0}.good{background:#e0f3e8!important;border-color:#64a681}.bad{background:#fae7e5!important;border-color:#c88179}.primary{background:#244a70;color:white}.primary:disabled{opacity:.45}.bar{height:8px;background:#e4edf5;border-radius:8px;overflow:hidden}.fill{height:100%;background:#86afd1}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}#feedback{background:#edf5fc;border-radius:12px;padding:15px;margin-top:15px}svg{max-width:320px;width:100%;display:block;margin:12px auto}footer{text-align:center;color:#587a9a;font-size:13px}.feedback{background:#edf5fc;border:1px solid #d5e5f3;border-radius:14px;padding:18px;margin-top:16px;color:#203b58}.feedback p,.feedback li{line-height:1.65;margin:8px 0}.feedback h3{font-size:18px;margin:14px 0 8px}.correct{color:#286344;font-weight:600}.nav{flex-wrap:wrap}@media(max-width:480px){main{padding:10px;margin:8px auto}header,section{padding:16px}} </style><main><header><small>ПОНЯТНАЯ МАТЕМАТИКА · 8 КЛАСС</small><h1>Площадь трапеции</h1><small>Обновлённая версия · 15 заданий · две формулы · от простого к сложному</small><svg viewBox="0 0 320 165" role="img" aria-label="Трапеция с основаниями, высотой и средней линией"><path d="M25 140H295L220 25H100Z" fill="#e1effa" stroke="#638db5" stroke-width="2"/><path d="M100 25V140 M100 130H110V140" fill="none" stroke="#b99a55" stroke-width="2"/><path d="M62.5 82.5H257.5" stroke="#638db5" stroke-dasharray="5 4"/><g fill="#244a70" font-size="14"><text x="155" y="18">b</text><text x="155" y="157">a</text><text x="85" y="72">h</text><text x="180" y="76">m</text></g></svg></header><section id="quiz"></section><footer>Спокойно · по шагам · с результатом</footer></main><script>
const q=[["Что такое трапеция?", ["Четырёхугольник с двумя парами параллельных сторон", "Четырёхугольник, у которого ровно одна пара противоположных сторон параллельна", "Любой четырёхугольник", "Четырёхугольник с равными сторонами"], 1, "В школьном определении трапеции две противоположные стороны параллельны, а две другие — нет."], ["Какие стороны трапеции называются основаниями?", ["Равные", "Самые длинные", "Параллельные", "Непараллельные"], 2, "Основания — параллельные стороны, остальные две стороны — боковые."], ["Какая трапеция называется равнобедренной?", ["С равными боковыми сторонами", "С равными основаниями", "С прямым углом", "С четырьмя равными сторонами"], 0, "У равнобедренной трапеции боковые стороны равны."], ["Что такое высота трапеции?", ["Боковая сторона", "Диагональ", "Средняя линия", "Перпендикуляр между прямыми, содержащими основания"], 3, "Высота — расстояние между параллельными прямыми, содержащими основания."], ["Чему равна средняя линия трапеции с основаниями 8 и 14 см?", ["22 см", "11 см", "6 см", "7 см"], 1, "Средняя линия соединяет середины боковых сторон. m = (8 + 14) : 2 = 11 см."], ["Выбери формулу площади трапеции.", ["S = (a + b) · h", "S = a · b", "S = (a + b) · h : 2", "S = (a − b) · h : 2"], 2, "Площадь равна произведению полусуммы оснований на высоту."], ["Основания 6 и 14 см, высота 5 см. Найди площадь.", ["50 см²", "100 см²", "30 см²", "70 см²"], 0, "S = (6 + 14) : 2 · 5 = 50 см²."], ["Средняя линия 12 см, высота 7 см. Найди площадь.", ["42 см²", "19 см²", "168 см²", "84 см²"], 3, "S = m · h = 12 · 7 = 84 см²."], ["Площадь 72 см², основания 8 и 16 см. Найди высоту.", ["3 см", "6 см", "9 см", "12 см"], 1, "m = (8 + 16) : 2 = 12 см. h = 72 : 12 = 6 см."], ["Площадь 90 см², высота 6 см, одно основание 12 см. Найди второе основание.", ["3 см", "15 см", "18 см", "30 см"], 2, "Сумма оснований равна 2 · 90 : 6 = 30 см. Второе основание: 30 − 12 = 18 см."], ["Периметр равнобедренной трапеции 46 см, боковая сторона 10 см, высота 8 см. Найди площадь.", ["104 см²", "208 см²", "80 см²", "184 см²"], 0, "Сумма оснований: 46 − 2 · 10 = 26 см. S = 26 : 2 · 8 = 104 см²."], ["Основания трапеции 10 и 18 см. Боковая сторона 12 см образует с большим основанием угол 30°. Найди площадь.", ["168 см²", "72 см²", "42 см²", "84 см²"], 3, "Высота — катет напротив угла 30°: h = 12 : 2 = 6 см. S = 14 · 6 = 84 см²."], ["В прямоугольной трапеции основания 7 и 15 см, наклонная боковая сторона 10 см. Найди площадь.", ["110 см²", "66 см²", "88 см²", "55 см²"], 1, "Разность оснований 8 см. По теореме Пифагора h = √(10² − 8²) = 6 см. S = 11 · 6 = 66 см²."], ["Основания равнобедренной трапеции 10 и 26 см, боковая сторона 17 см. Найди площадь.", ["306 см²", "135 см²", "270 см²", "540 см²"], 2, "Проекция боковой стороны: (26 − 10) : 2 = 8 см. Высота √(17² − 8²) = 15 см. S = 18 · 15 = 270 см²."], ["Основания относятся как 2 : 3, высота 8 см, площадь 100 см². Найди основания.", ["10 и 15 см", "8 и 12 см", "20 и 30 см", "5 и 10 см"], 0, "Пусть основания 2x и 3x. Тогда (2x + 3x) : 2 · 8 = 100. 20x = 100, x = 5. Основания 10 и 15 см."]];
let order=q.map((_,i)=>i), n=0, a={};const el=document.getElementById('quiz');
function node(tag,txt,cls,parent=el){const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;parent.append(e);return e;}
function explain(t,parent){node('h3','Разберёмся по шагам','',parent);const steps=t[3].split(/(?<=\.)\s+(?=[А-ЯЁA-Z√])|;\s*/).filter(Boolean);const list=node('ol','','',parent);steps.forEach(x=>node('li',x,'',list));}
function draw(){const idx=order[n],t=q[idx],v=a[idx];el.innerHTML=`<small>Задание ${idx+1} · ${n+1} из ${order.length}</small><div class="bar"><div class="fill" style="width:${(n+1)/order.length*100}%"></div></div>`;node('h2',t[0]);
if([1,3,4,6,7,8,9].includes(idx)){el.innerHTML+="<svg viewBox=\"0 0 320 165\" role=\"img\" aria-label=\"Трапеция с основаниями, высотой и средней линией\"><path d=\"M25 140H295L220 25H100Z\" fill=\"#e1effa\" stroke=\"#638db5\" stroke-width=\"2\"/><path d=\"M100 25V140 M100 130H110V140\" fill=\"none\" stroke=\"#b99a55\" stroke-width=\"2\"/><path d=\"M62.5 82.5H257.5\" stroke=\"#638db5\" stroke-dasharray=\"5 4\"/><g fill=\"#244a70\" font-size=\"14\"><text x=\"155\" y=\"18\">b</text><text x=\"155\" y=\"157\">a</text><text x=\"85\" y=\"72\">h</text><text x=\"180\" y=\"76\">m</text></g></svg>"}
t[1].forEach((s,i)=>{const b=node('button','АБВГ'[i]+'. '+s,'opt '+(v!==undefined?(i===t[2]?'good':i===v?'bad':''):''));b.disabled=v!==undefined;b.onclick=()=>{a[idx]=i;draw();};});
if(v!==undefined){const f=node('div','','feedback');f.setAttribute('role','status');node('strong',v===t[2]?'Верно!':'Пока неверно — посмотрим решение.','',f);node('p','Твой ответ: '+t[1][v],'',f);node('p','Правильный ответ: '+t[1][t[2]],'correct',f);explain(t,f);}
const nav=node('div','','nav');const back=node('button','Назад','',nav);back.disabled=n===0;back.onclick=()=>{n--;draw()};const next=node('button',n===order.length-1?'Результат':'Далее →','primary',nav);next.disabled=v===undefined;next.onclick=()=>{if(n+1<order.length){n++;draw()}else result()};}
function reset(ids){order=ids;n=0;a={};draw();}
function result(){const wrong=order.filter(i=>a[i]!==q[i][2]);el.replaceChildren();node('small','ТВОЙ РЕЗУЛЬТАТ');node('h1',`${order.length-wrong.length} из ${order.length}`);node('p',wrong.length?'Повтори задания, в которых ошибся.':'Отличная работа!');wrong.forEach(i=>{const f=node('div','','feedback');node('h3',`${i+1}. ${q[i][0]}`,'',f);node('p','Твой ответ: '+q[i][1][a[i]],'',f);node('p','Правильный ответ: '+q[i][1][q[i][2]],'correct',f);explain(q[i],f)});const nav=node('div','','nav');if(wrong.length)node('button','Повторить только ошибки','primary',nav).onclick=()=>reset(wrong);node('button','Пройти все 15 заново','',nav).onclick=()=>reset(q.map((_,i)=>i));}draw();
</script></html>
