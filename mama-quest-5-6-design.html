<!DOCTYPE html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>15 шагов к маминому сердцу</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fdf8f3,#e4eef9);color:#203c60;font:17px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}main{width:min(680px,100%);background:#fffdf9;border:1px solid #e6ded5;border-radius:28px;padding:clamp(20px,5vw,44px);box-shadow:0 20px 70px #27456a16;text-align:center}small{letter-spacing:2px;color:#647b96}h1{font-size:clamp(28px,5vw,42px);line-height:1.15}button,input{font:inherit;border-radius:14px;padding:13px 20px;margin:6px;border:1px solid #c8d6e5}button{background:#25466c;color:white;cursor:pointer}button.secondary{background:#e9eff7;color:#25466c}input{max-width:90%;text-align:center}#letters{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:24px 0}.letter{width:32px;height:39px;display:grid;place-items:center;background:#e8eff8;border-radius:8px;font-weight:bold}.open{background:#f8dce4;color:#98445f}.heart{font-size:65px;color:#d888a0;text-shadow:0 7px 0 #b96e85,0 14px 24px #d888a055}#feedback{min-height:50px;color:#8b5262}#question{font-size:clamp(19px,4vw,30px);font-weight:700}progress{width:100%;accent-color:#cb829b}#final{animation:appear .7s ease}@keyframes appear{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}@media print{body{background:white}main{box-shadow:none}button,input,small{display:none}} .heart{position:relative;isolation:isolate;display:grid;place-items:center;width:min(100%,340px);height:220px;margin:12px auto 20px;font-size:0;text-shadow:none;background:radial-gradient(ellipse at center,#f9dce7 0%,#fdf0f3 42%,transparent 72%)}.heart svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 12px 12px #a6537526)}#final .heart{height:260px;width:min(100%,390px)}@media(max-width:480px){.heart{height:185px}#final .heart{height:210px}}@media print{.heart{height:180px!important}}</style><main><small>ПОНЯТНАЯ МАТЕМАТИКА</small><section id="home"><div class="heart" aria-label="Праздничное сердце"><svg viewBox="0 0 340 220" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="rose1" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f9cbd8"/><stop offset=".48" stop-color="#df8fa9"/><stop offset="1" stop-color="#a94e72"/></linearGradient></defs><ellipse cx="170" cy="197" rx="78" ry="9" fill="#c98ca5" opacity=".2"/><path d="M170 185C140 161 85 120 85 76C85 27 144 20 170 62C196 20 255 27 255 76C255 120 200 161 170 185Z" fill="#a95779" transform="translate(0 6)"/><path d="M170 185C140 161 85 120 85 76C85 27 144 20 170 62C196 20 255 27 255 76C255 120 200 161 170 185Z" fill="url(#rose1)"/><path d="M99 72Q104 45 131 45" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="8" stroke-linecap="round"/><g fill="#c4a064"><path d="M48 35l4 12 12 4-12 4-4 12-4-12-12-4 12-4z"/><path d="M287 115l4 12 12 4-12 4-4 12-4-12-12-4 12-4z"/><circle cx="265" cy="29" r="4"/><circle cx="69" cy="161" r="4"/></g><g fill="#7696b9" font-family="Georgia,serif" font-size="27" font-weight="bold"><text x="27" y="110" transform="rotate(-12 27 110)">2³</text><text x="276" y="78" transform="rotate(12 276 78)">+</text><text x="254" y="183">∞</text></g><g fill="#e4a2b7"><path d="M67 185c-20-13-22-25-12-28 6-2 10 2 12 6 3-4 8-8 13-6 10 3 8 15-13 28z"/><path d="M286 38c-15-10-17-19-9-21 4-2 7 1 9 4 2-3 6-6 10-4 8 2 6 11-10 21z"/></g></svg></div><h1>15 шагов к маминому сердцу</h1><p>Решай задания, открывай буквы и создай секретную открытку для мамы!</p><button onclick="start(0)">3–4 классы</button><button onclick="start(1)">5–6 классы</button></section><section id="game" hidden><p id="count"></p><progress id="progress" max="15" value="0"></progress><div id="letters"></div><div id="question"></div><form id="form"><input id="answer" placeholder="Твой ответ" autocomplete="off" inputmode="decimal" aria-label="Ответ"><button>Проверить</button></form><p id="feedback" aria-live="polite"></p><button class="secondary" onclick="hint()">Подсказка</button><button class="secondary" onclick="home()">В меню</button></section><section id="final" hidden><div class="heart" aria-label="Праздничное сердце"><svg viewBox="0 0 340 220" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="rose2" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f9cbd8"/><stop offset=".48" stop-color="#df8fa9"/><stop offset="1" stop-color="#a94e72"/></linearGradient></defs><ellipse cx="170" cy="197" rx="78" ry="9" fill="#c98ca5" opacity=".2"/><path d="M170 185C140 161 85 120 85 76C85 27 144 20 170 62C196 20 255 27 255 76C255 120 200 161 170 185Z" fill="#a95779" transform="translate(0 6)"/><path d="M170 185C140 161 85 120 85 76C85 27 144 20 170 62C196 20 255 27 255 76C255 120 200 161 170 185Z" fill="url(#rose2)"/><path d="M99 72Q104 45 131 45" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="8" stroke-linecap="round"/><g fill="#c4a064"><path d="M48 35l4 12 12 4-12 4-4 12-4-12-12-4 12-4z"/><path d="M287 115l4 12 12 4-12 4-4 12-4-12-12-4 12-4z"/><circle cx="265" cy="29" r="4"/><circle cx="69" cy="161" r="4"/></g><g fill="#7696b9" font-family="Georgia,serif" font-size="27" font-weight="bold"><text x="27" y="110" transform="rotate(-12 27 110)">2³</text><text x="276" y="78" transform="rotate(12 276 78)">+</text><text x="254" y="183">∞</text></g><g fill="#e4a2b7"><path d="M67 185c-20-13-22-25-12-28 6-2 10 2 12 6 3-4 8-8 13-6 10 3 8 15-13 28z"/><path d="M286 38c-15-10-17-19-9-21 4-2 7 1 9 4 2-3 6-6 10-4 8 2 6 11-10 21z"/></g></svg></div><h1>Мама, я люблю тебя!</h1><p>Мамочка, каждую букву этого поздравления я открыл самостоятельно. Решал, думал, старался. Потому что эта открытка — специально для тебя!</p><p>С Днём матери!</p><input id="name" placeholder="Впиши своё имя" oninput="document.getElementById('signature').textContent=this.value?'С любовью, '+this.value:''"><h3 id="signature"></h3><button onclick="window.print()">Сохранить / распечатать открытку</button><button class="secondary" onclick="home()">Начать заново</button></section></main><script>
const sets=[[['7 × 8',56,'7 умножь на 8.'],['63 : 9',7,'Какое число при умножении на 9 даёт 63?'],['125 + 75',200,'Дополни 125 до круглой сотни.'],['300 − 145',155,'Вычти сначала 100, затем 45.'],['6 × 9',54,'6 × 10 − 6.'],['48 : 6',8,'Вспомни таблицу умножения на 6.'],['24 + 36',60,'Сложи десятки и единицы.'],['8 × 4',32,'Удвой 8 дважды.'],['90 − 37',53,'Вычти 40 и прибавь 3.'],['72 : 8',9,'8 × ? = 72.'],['5 × (12 − 4)',40,'Сначала скобки.'],['120 : 4',30,'12 : 4 = 3.'],['36 + 64',100,'Сложи десятки и единицы.'],['9 × 7',63,'9 × 7 = 10 × 7 − 7.'],['100 − 6 × 8',52,'Сначала умножение.']],[['2,5 + 3,7',6.2,'Запиши запятую под запятой.'],['3/4 от 28',21,'Раздели 28 на 4 и умножь на 3.'],['x + 17 = 42',25,'Вычти 17 из 42.'],['0,6 × 8',4.8,'6 × 8 = 48; учти десятичный знак.'],['20% от 150',30,'Найди пятую часть 150.'],['5x = 45',9,'Раздели обе части на 5.'],['7,2 : 0,9',8,'Умножь оба числа на 10.'],['2³ + 3²',17,'2³ = 2 × 2 × 2, а 3² = 3 × 3. Сложи результаты.'],['2/3 от 36',24,'36 раздели на 3 и умножь на 2.'],['4 × (3 + 5)',32,'Сначала скобки.'],['x : 6 = 7',42,'Умножь 7 на 6.'],['1,5 × 4',6,'Сложи 1,5 четыре раза.'],['50% от 86',43,'Найди половину.'],['5² − 2³',17,'5² = 5 × 5, а 2³ = 2 × 2 × 2. Найди разность.'],['3² + 4²',25,'Возведи каждое число в квадрат и сложи.']]];const phrase='МАМАЯЛЮБЛЮТЕБЯ♥';let level=0,i=0;const el=id=>document.getElementById(id);function show(id){for(const s of ['home','game','final'])el(s).hidden=s!==id}function home(){show('home')}function start(l){level=l;i=0;show('game');render()}function render(){el('count').textContent=`Шаг ${i+1} из 15`;el('progress').value=i;el('letters').replaceChildren(...Array.from(phrase,(c,j)=>{let b=document.createElement('span');b.className='letter'+(j<i?' open':'');b.textContent=j<i?c:'♡';return b}));el('question').textContent=sets[level][i][0];el('answer').value='';el('feedback').textContent='';el('answer').focus()}function hint(){el('feedback').textContent=sets[level][i][2]}el('form').onsubmit=e=>{e.preventDefault();let v=el('answer').value.trim().replace(',','.');if(v&&Math.abs(Number(v)-sets[level][i][1])<1e-8){i++;if(i===15){show('final')}else{render();el('feedback').textContent='Верно! Новая буква открыта. ♥'}}else{el('feedback').textContent='Попробуй ещё раз. '+sets[level][i][2]}};
</script></html>
