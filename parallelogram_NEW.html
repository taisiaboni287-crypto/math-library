<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Площадь параллелограмма</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f6fb;color:#203b58;font:17px system-ui}main{max-width:780px;margin:24px auto;padding:22px}header,section{background:white;border:1px solid #dce7f1;border-radius:24px;padding:26px;margin-bottom:18px}small{color:#587a9a}h1{font-size:clamp(25px,5vw,38px);margin:12px 0}h2{font-size:23px}button{font:inherit;cursor:pointer;border:1px solid #cbddeb;border-radius:12px;padding:14px;background:#f6faff;color:#203b58}button:hover{background:#e4eff9}button:disabled{cursor:default} .opt{display:block;width:100%;text-align:left;margin:9px 0}.good{background:#e0f3e8!important;border-color:#64a681}.bad{background:#fae7e5!important;border-color:#c88179}.primary{background:#244a70;color:white}.primary:disabled{opacity:.45}.bar{height:8px;background:#e4edf5;border-radius:8px;overflow:hidden}.fill{height:100%;background:#86afd1}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}#feedback{background:#edf5fc;border-radius:12px;padding:15px;margin-top:15px}svg{max-width:320px;width:100%;display:block;margin:12px auto}footer{text-align:center;color:#587a9a;font-size:13px}.feedback{background:#edf5fc;border:1px solid #d5e5f3;border-radius:14px;padding:18px;margin-top:16px;color:#203b58}.feedback p,.feedback li{line-height:1.65;margin:8px 0}.feedback h3{font-size:18px;margin:14px 0 8px}.correct{color:#286344;font-weight:600}.nav{flex-wrap:wrap}@media(max-width:480px){main{padding:10px;margin:8px auto}header,section{padding:16px}} </style><main><header><small>ПОНЯТНАЯ МАТЕМАТИКА · 8 КЛАСС</small><h1>Площадь параллелограмма</h1><small>Обновлённая версия · 15 заданий · от простого к сложному</small><svg viewBox="0 0 320 125"><path d="M35 100H225L280 20H90Z" fill="#e1effa" stroke="#638db5" stroke-width="2"/><path d="M90 20V100" stroke="#b99a55" stroke-width="2" stroke-dasharray="5 4"/><path d="M90 90H100V100" fill="none" stroke="#b99a55"/><text x="74" y="65" fill="#846b37">h</text><text x="145" y="118" fill="#244a70">a</text><text x="143" y="65" fill="#244a70" font-size="22">S = a · h</text></svg></header><section id="quiz"></section><footer>Спокойно · по шагам · с результатом</footer></main><script>
const q=[
['Выбери формулу площади параллелограмма.',['S = a · b','S = a · h','S = 2(a + b)','S = a · h : 2'],1,'Умножаем основание на соответствующую высоту.'],
['Что такое высота параллелограмма?',['Диагональ','Любая боковая сторона','Перпендикуляр из вершины к прямой, содержащей противоположную сторону','Любой отрезок внутри фигуры'],2,'Высота образует прямой угол с прямой, содержащей основание.'],
['Сколько высот можно провести из одной вершины к двум сторонам, не содержащим эту вершину?',['Одну','Две','Три','Четыре'],1,'К каждой из двух прямых можно провести ровно один перпендикуляр.'],
['Может ли высота проходить вне параллелограмма?',['Да','Нет'],0,'Да. Основание перпендикуляра может лежать на продолжении стороны.'],
['Основание 8 см, высота 5 см. Найди площадь.',['13 см²','20 см²','40 см²','80 см²'],2,'8 · 5 = 40 см².'],
['Стороны 10 и 6 см. Высота к стороне 10 см равна 4 см. Найди площадь.',['60 см²','24 см²','20 см²','40 см²'],3,'10 · 4 = 40 см².'],
['Площадь 72 см², основание 12 см. Найди высоту.',['6 см','8 см','9 см','12 см'],0,'72 : 12 = 6 см.'],
['Площадь 96 см², высота 8 см. Найди основание.',['10 см','12 см','14 см','16 см'],1,'96 : 8 = 12 см.'],
['Основание 1,2 дм, высота 5 см. Найди площадь в см².',['6','600','60','17'],2,'1,2 дм = 12 см; 12 · 5 = 60 см².'],
['Основание увеличили втрое, высоту уменьшили втрое. Как изменилась площадь?',['Увеличилась втрое','Уменьшилась втрое','Увеличилась в 9 раз','Не изменилась'],3,'Множители 3 и 1/3 взаимно компенсируются.'],
['Стороны 12 и 8 см. Высота к большей стороне 6 см. Найди высоту к меньшей.',['4 см','9 см','12 см','16 см'],1,'12 · 6 = 72 см²; 72 : 8 = 9 см.'],
['К какой стороне параллелограмма с неравными сторонами проведена большая высота?',['К большей','К меньшей','Высоты равны'],1,'Площадь постоянна: чем меньше основание, тем больше высота.'],
['Стороны 10 и 14 см, угол между ними 30°. Найди площадь.',['140 см²','35 см²','70 см²','24 см²'],2,'Высота к стороне 14 см равна 10 : 2 = 5 см. Площадь 14 · 5 = 70 см².'],
['Периметр 48 см. Одна сторона 15 см, высота к другой стороне 7 см. Найди площадь.',['105 см²','63 см²','168 см²','56 см²'],1,'Вторая сторона 48 : 2 − 15 = 9 см. Площадь 9 · 7 = 63 см².'],
['Основание на 4 см больше высоты. Площадь 96 см². Найди основание и высоту.',['16 и 6 см','10 и 6 см','14 и 10 см','12 и 8 см'],3,'x(x + 4) = 96; положительный корень x = 8. Основание 12 см.']];
let order=q.map((_,i)=>i), n=0, a={};const el=document.getElementById('quiz');
function node(tag,txt,cls,parent=el){const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;parent.append(e);return e;}
function explain(t,parent){node('h3','Разберёмся по шагам','',parent);const steps=t[3].split(/(?<=\.)\s+(?=[А-ЯЁA-Z√])|;\s*/).filter(Boolean);const list=node('ol','','',parent);steps.forEach(x=>node('li',x,'',list));}
function draw(){const idx=order[n],t=q[idx],v=a[idx];el.innerHTML=`<small>Задание ${idx+1} · ${n+1} из ${order.length}</small><div class="bar"><div class="fill" style="width:${(n+1)/order.length*100}%"></div></div>`;node('h2',t[0]);
if(idx===2||idx===3){el.innerHTML+=idx===2?'<svg viewBox="0 0 320 160"><path d="M35 130H220L280 30H95Z" fill="#e1effa" stroke="#638db5" stroke-width="2"/><path d="M95 30V130 M95 30L230.88 111.47" stroke="#b99a55" stroke-width="2" stroke-dasharray="5 4"/><path d="M95 120H105V130 M225.74 120.04L217.17 114.9L222.31 106.33" fill="none" stroke="#b99a55"/></svg>':'<svg viewBox="0 0 320 160"><path d="M95 130H260L195 30H30Z" fill="#e1effa" stroke="#638db5" stroke-width="2"/><path d="M30 30V130H95" stroke="#b99a55" stroke-width="2" stroke-dasharray="5 4" fill="none"/><path d="M30 120H40V130" fill="none" stroke="#b99a55"/></svg>'}
t[1].forEach((s,i)=>{const b=node('button','АБВГ'[i]+'. '+s,'opt '+(v!==undefined?(i===t[2]?'good':i===v?'bad':''):''));b.disabled=v!==undefined;b.onclick=()=>{a[idx]=i;draw();};});
if(v!==undefined){const f=node('div','','feedback');f.setAttribute('role','status');node('strong',v===t[2]?'Верно!':'Пока неверно — посмотрим решение.','',f);node('p','Твой ответ: '+t[1][v],'',f);node('p','Правильный ответ: '+t[1][t[2]],'correct',f);explain(t,f);}
const nav=node('div','','nav');const back=node('button','Назад','',nav);back.disabled=n===0;back.onclick=()=>{n--;draw()};const next=node('button',n===order.length-1?'Результат':'Далее →','primary',nav);next.disabled=v===undefined;next.onclick=()=>{if(n+1<order.length){n++;draw()}else result()};}
function reset(ids){order=ids;n=0;a={};draw();}
function result(){const wrong=order.filter(i=>a[i]!==q[i][2]);el.replaceChildren();node('small','ТВОЙ РЕЗУЛЬТАТ');node('h1',`${order.length-wrong.length} из ${order.length}`);node('p',wrong.length?'Повтори задания, в которых ошибся.':'Отличная работа!');wrong.forEach(i=>{const f=node('div','','feedback');node('h3',`${i+1}. ${q[i][0]}`,'',f);node('p','Твой ответ: '+q[i][1][a[i]],'',f);node('p','Правильный ответ: '+q[i][1][q[i][2]],'correct',f);explain(q[i],f)});const nav=node('div','','nav');if(wrong.length)node('button','Повторить только ошибки','primary',nav).onclick=()=>reset(wrong);node('button','Пройти все 15 заново','',nav).onclick=()=>reset(q.map((_,i)=>i));}draw();
</script></html>
