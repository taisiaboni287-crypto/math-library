<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Площадь ромба</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f6fb;color:#203b58;font:17px system-ui}main{max-width:780px;margin:24px auto;padding:22px}header,section{background:white;border:1px solid #dce7f1;border-radius:24px;padding:26px;margin-bottom:18px}small{color:#587a9a}h1{font-size:clamp(25px,5vw,38px);margin:12px 0}h2{font-size:23px}button{font:inherit;cursor:pointer;border:1px solid #cbddeb;border-radius:12px;padding:14px;background:#f6faff;color:#203b58}button:hover{background:#e4eff9}button:disabled{cursor:default} .opt{display:block;width:100%;text-align:left;margin:9px 0}.good{background:#e0f3e8!important;border-color:#64a681}.bad{background:#fae7e5!important;border-color:#c88179}.primary{background:#244a70;color:white}.primary:disabled{opacity:.45}.bar{height:8px;background:#e4edf5;border-radius:8px;overflow:hidden}.fill{height:100%;background:#86afd1}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}#feedback{background:#edf5fc;border-radius:12px;padding:15px;margin-top:15px}svg{max-width:320px;width:100%;display:block;margin:12px auto}footer{text-align:center;color:#587a9a;font-size:13px}.feedback{background:#edf5fc;border:1px solid #d5e5f3;border-radius:14px;padding:18px;margin-top:16px;color:#203b58}.feedback p,.feedback li{line-height:1.65;margin:8px 0}.feedback h3{font-size:18px;margin:14px 0 8px}.correct{color:#286344;font-weight:600}.nav{flex-wrap:wrap}@media(max-width:480px){main{padding:10px;margin:8px auto}header,section{padding:16px}} </style><main><header><small>ПОНЯТНАЯ МАТЕМАТИКА · 8 КЛАСС</small><h1>Площадь ромба</h1><small>Обновлённая версия · 15 заданий · две формулы · от простого к сложному</small><svg viewBox="0 0 320 140" role="img" aria-label="Ромб с высотой и ромб с диагоналями"><g fill="#e1effa" stroke="#638db5" stroke-width="2"><path d="M12 100H92L132 30.72H52Z"/><path d="M165 65L235 20L305 65L235 110Z"/></g><g stroke="#b99a55" stroke-width="1.8" fill="none"><path d="M52 31V100 M52 90H62V100 M165 65H305 M235 20V110 M235 55H245V65"/></g><g fill="#244a70" font-size="14"><text x="36" y="70">h</text><text x="48" y="118">a</text><text x="265" y="59">d₁</text><text x="241" y="43">d₂</text></g></svg></header><section id="quiz"></section><footer>Спокойно · по шагам · с результатом</footer></main><script>
const q=[["Какая формула площади ромба через сторону a и высоту h?", ["S = a²", "S = a · h", "S = 4a", "S = a · h : 2"], 1, "Ромб — параллелограмм, поэтому S = a · h."], ["Как найти площадь ромба через диагонали?", ["S = d₁ · d₂", "S = (d₁ + d₂) : 2", "S = d₁ · d₂ : 2", "S = 2d₁ · d₂"], 2, "Площадь равна половине произведения диагоналей."], ["Под каким углом пересекаются диагонали ромба?", ["90°", "45°", "60°", "Угол может быть любым"], 0, "Диагонали ромба взаимно перпендикулярны и делятся точкой пересечения пополам."], ["Всегда ли площадь ромба равна квадрату его стороны?", ["Да", "Нет, только если ромб является квадратом"], 1, "S = a · h. Высота равна стороне только у квадрата."], ["Сторона ромба 9 см, высота 4 см. Найди площадь.", ["18 см²", "81 см²", "26 см²", "36 см²"], 3, "S = 9 · 4 = 36 см²."], ["Диагонали ромба 8 см и 12 см. Найди площадь.", ["48 см²", "96 см²", "20 см²", "24 см²"], 0, "S = 8 · 12 : 2 = 48 см²."], ["Площадь ромба 60 см², сторона 12 см. Найди высоту.", ["6 см", "10 см", "5 см", "4 см"], 2, "h = 60 : 12 = 5 см."], ["Площадь ромба 84 см², одна диагональ 14 см. Найди другую.", ["6 см", "12 см", "7 см", "24 см"], 1, "d₂ = 2 · 84 : 14 = 12 см."], ["Периметр ромба 40 см, высота 6 см. Найди площадь.", ["240 см²", "30 см²", "100 см²", "60 см²"], 3, "a = 40 : 4 = 10 см. S = 10 · 6 = 60 см²."], ["Диагонали ромба 1,6 дм и 10 см. Найди площадь в см².", ["80 см²", "8 см²", "160 см²", "800 см²"], 0, "1,6 дм = 16 см. S = 16 · 10 : 2 = 80 см²."], ["Точка O — пересечение диагоналей ромба ABCD. AO = 6 см, BO = 4 см. Найди площадь.", ["12 см²", "24 см²", "48 см²", "96 см²"], 2, "AC = 12 см, BD = 8 см. S = 12 · 8 : 2 = 48 см²."], ["Сторона ромба 13 см, одна диагональ 10 см. Найди площадь.", ["60 см²", "120 см²", "130 см²", "65 см²"], 1, "Половина первой диагонали 5 см. По теореме Пифагора половина второй равна √(169 − 25) = 12 см. Вторая диагональ 24 см. S = 10 · 24 : 2 = 120 см²."], ["Диагонали ромба 12 см и 16 см. Найди высоту.", ["10 см", "8 см", "12 см", "9,6 см"], 3, "S = 12 · 16 : 2 = 96 см². Сторона равна √(6² + 8²) = 10 см. h = 96 : 10 = 9,6 см."], ["Сторона ромба 12 см, острый угол 30°. Найди площадь.", ["72 см²", "144 см²", "36 см²", "48 см²"], 0, "Высота — катет напротив угла 30°, поэтому h = 12 : 2 = 6 см. S = 12 · 6 = 72 см²."], ["Диагонали ромба относятся как 3 : 4, площадь равна 96 см². Найди периметр.", ["20 см", "56 см", "40 см", "48 см"], 2, "Пусть диагонали 3x и 4x. Тогда 6x² = 96, x = 4. Диагонали 12 и 16 см. Сторона √(6² + 8²) = 10 см. P = 40 см."]];
let order=q.map((_,i)=>i), n=0, a={};const el=document.getElementById('quiz');
function node(tag,txt,cls,parent=el){const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;parent.append(e);return e;}
function explain(t,parent){node('h3','Разберёмся по шагам','',parent);const steps=t[3].split(/(?<=\.)\s+(?=[А-ЯЁA-Z√])|;\s*/).filter(Boolean);const list=node('ol','','',parent);steps.forEach(x=>node('li',x,'',list));}
function draw(){const idx=order[n],t=q[idx],v=a[idx];el.innerHTML=`<small>Задание ${idx+1} · ${n+1} из ${order.length}</small><div class="bar"><div class="fill" style="width:${(n+1)/order.length*100}%"></div></div>`;node('h2',t[0]);
if([2,5,7,10,11,12,14].includes(idx)){el.innerHTML+='<svg viewBox="0 0 320 190" role="img" aria-label="Диагонали ромба ABCD"><path d="M30 95L160 15L290 95L160 175Z" fill="#e1effa" stroke="#638db5" stroke-width="2"/><path d="M30 95H290 M160 15V175 M160 85H170V95" fill="none" stroke="#b99a55" stroke-width="2"/><g fill="#244a70" font-size="14"><text x="12" y="95">A</text><text x="155" y="12">B</text><text x="298" y="95">C</text><text x="155" y="188">D</text><text x="168" y="110">O</text></g></svg>'}
t[1].forEach((s,i)=>{const b=node('button','АБВГ'[i]+'. '+s,'opt '+(v!==undefined?(i===t[2]?'good':i===v?'bad':''):''));b.disabled=v!==undefined;b.onclick=()=>{a[idx]=i;draw();};});
if(v!==undefined){const f=node('div','','feedback');f.setAttribute('role','status');node('strong',v===t[2]?'Верно!':'Пока неверно — посмотрим решение.','',f);node('p','Твой ответ: '+t[1][v],'',f);node('p','Правильный ответ: '+t[1][t[2]],'correct',f);explain(t,f);}
const nav=node('div','','nav');const back=node('button','Назад','',nav);back.disabled=n===0;back.onclick=()=>{n--;draw()};const next=node('button',n===order.length-1?'Результат':'Далее →','primary',nav);next.disabled=v===undefined;next.onclick=()=>{if(n+1<order.length){n++;draw()}else result()};}
function reset(ids){order=ids;n=0;a={};draw();}
function result(){const wrong=order.filter(i=>a[i]!==q[i][2]);el.replaceChildren();node('small','ТВОЙ РЕЗУЛЬТАТ');node('h1',`${order.length-wrong.length} из ${order.length}`);node('p',wrong.length?'Повтори задания, в которых ошибся.':'Отличная работа!');wrong.forEach(i=>{const f=node('div','','feedback');node('h3',`${i+1}. ${q[i][0]}`,'',f);node('p','Твой ответ: '+q[i][1][a[i]],'',f);node('p','Правильный ответ: '+q[i][1][q[i][2]],'correct',f);explain(q[i],f)});const nav=node('div','','nav');if(wrong.length)node('button','Повторить только ошибки','primary',nav).onclick=()=>reset(wrong);node('button','Пройти все 15 заново','',nav).onclick=()=>reset(q.map((_,i)=>i));}draw();
</script></html>
