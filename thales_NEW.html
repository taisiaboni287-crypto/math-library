<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Теорема Фалеса</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f6fb;color:#203b58;font:17px system-ui}main{max-width:780px;margin:24px auto;padding:22px}header,section{background:white;border:1px solid #dce7f1;border-radius:24px;padding:26px;margin-bottom:18px}small{color:#587a9a}h1{font-size:clamp(25px,5vw,38px);margin:12px 0}h2{font-size:23px}button{font:inherit;cursor:pointer;border:1px solid #cbddeb;border-radius:12px;padding:14px;background:#f6faff;color:#203b58}button:hover{background:#e4eff9}button:disabled{cursor:default} .opt{display:block;width:100%;text-align:left;margin:9px 0}.good{background:#e0f3e8!important;border-color:#64a681}.bad{background:#fae7e5!important;border-color:#c88179}.primary{background:#244a70;color:white}.primary:disabled{opacity:.45}.bar{height:8px;background:#e4edf5;border-radius:8px;overflow:hidden}.fill{height:100%;background:#86afd1}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}#feedback{background:#edf5fc;border-radius:12px;padding:15px;margin-top:15px}svg{max-width:320px;width:100%;display:block;margin:12px auto}footer{text-align:center;color:#587a9a;font-size:13px}.feedback{background:#edf5fc;border:1px solid #d5e5f3;border-radius:14px;padding:18px;margin-top:16px;color:#203b58}.feedback p,.feedback li{line-height:1.65;margin:8px 0}.feedback h3{font-size:18px;margin:14px 0 8px}.correct{color:#286344;font-weight:600}.nav{flex-wrap:wrap}@media(max-width:480px){main{padding:10px;margin:8px auto}header,section{padding:16px}} </style><main><header><small>ПОНЯТНАЯ МАТЕМАТИКА · 8 КЛАСС</small><h1>Теорема Фалеса</h1><small>15 заданий · от простого к сложному</small><svg viewBox="0 0 340 210" aria-label="Три параллельные прямые и две секущие"><g stroke="#638db5" stroke-width="2" fill="none"><path d="M30 10L110 200M30 10L310 200"/></g><g stroke="#b99a55" stroke-width="2"><path d="M20 60H325M20 115H325M20 170H325"/></g><text x="26.05263157894737" y="54" fill="#203b58">A1</text><text x="110.6842105263158" y="54" fill="#203b58">B1</text><text x="49.21052631578948" y="109" fill="#203b58">A2</text><text x="191.73684210526315" y="109" fill="#203b58">B2</text><text x="72.36842105263158" y="164" fill="#203b58">A3</text><text x="272.7894736842105" y="164" fill="#203b58">B3</text></svg></header><section id="quiz"></section><footer>Спокойно · по шагам · с результатом</footer></main><script>
const q=[["Какие прямые должны пересекать две секущие, чтобы применить теорему Фалеса?", ["Параллельные", "Перпендикулярные друг другу", "Любые", "Только совпадающие"], 0, "Проверяем условие: прямые должны быть параллельны. Равные последовательные отрезки на одной секущей дают равные отрезки на другой."], ["A₁A₂ = A₂A₃. Что следует из теоремы Фалеса на рисунке?", ["A₁A₂ = B₁B₂", "B₁B₂ = B₂B₃", "A₁B₁ = A₂B₂", "Все отрезки равны"], 1, "Параллельные прямые отсекают равные отрезки на первой секущей. Поэтому B₁B₂ = B₂B₃. Длины на разных секущих не обязаны совпадать."], ["Можно ли применить теорему Фалеса, если параллельность прямых не установлена?", ["Всегда", "Если отрезки выглядят равными", "Нет, недостаточно данных", "Если секущие пересекаются"], 2, "Равенство отрезков на одной секущей недостаточно. Необходимо установить параллельность прямых."], ["Должны ли две секущие обязательно пересекаться между собой?", ["Да", "Только под прямым углом", "Только внутри рисунка", "Нет"], 3, "Теорема действует и для параллельных секущих. Главное — параллельность прямых, отсекающих равные отрезки."], ["На первой секущей A₁A₂ = A₂A₃ = 4 см. На второй B₁B₂ = 7 см. Найди B₂B₃.", ["4 см", "7 см", "11 см", "3 см"], 1, "По теореме Фалеса B₁B₂ = B₂B₃. Значит, B₂B₃ = 7 см."], ["На первой секущей два равных отрезка. На второй B₁B₃ = 18 см. Найди B₁B₂.", ["9 см", "6 см", "18 см", "36 см"], 0, "По теореме Фалеса B₁B₂ = B₂B₃. Весь отрезок состоит из двух равных частей. 18 : 2 = 9 см."], ["Четыре параллельные прямые отсекают на первой секущей три равных отрезка. На второй крайние точки удалены на 27 см. Найди одну часть.", ["6,75 см", "13,5 см", "9 см", "27 см"], 2, "Четыре точки образуют три промежутка. По теореме Фалеса они равны. 27 : 3 = 9 см."], ["Пять параллельных прямых делят отрезок второй секущей на равные части. Длина каждой части 6 см. Какова длина между крайними точками?", ["30 см", "18 см", "12 см", "24 см"], 3, "Пять точек образуют четыре промежутка. Общая длина 4 · 6 = 24 см."], ["На рисунке A₁A₂ = A₂A₃, B₁B₂ = 2x + 3, B₂B₃ = 15. Найди x.", ["6", "9", "12", "15"], 0, "По теореме Фалеса 2x + 3 = 15. Вычитаем 3: 2x = 12. Делим на 2: x = 6."], ["B₁B₂ = 3x − 2, B₂B₃ = x + 8. На первой секущей соответствующие отрезки равны. Найди B₁B₃.", ["13 см", "26 см", "10 см", "20 см"], 1, "Приравниваем: 3x − 2 = x + 8. Получаем 2x = 10, x = 5. Каждая часть равна 13 см. Весь отрезок равен 26 см."], ["Как разделить отрезок AB на 5 равных частей с помощью теоремы Фалеса?", ["Провести 5 произвольных прямых", "Отложить 4 равных отрезка на луче", "Отложить 5 равных отрезков на луче из A, соединить последнюю точку с B и провести параллели через остальные точки", "Соединить середины сторон"], 2, "Из A проводим вспомогательный луч. Откладываем пять равных отрезков. Соединяем пятую точку с B. Через четыре промежуточные точки проводим параллели к этой прямой. По теореме Фалеса получаем пять равных частей AB."], ["В треугольнике ABC точка M — середина AB. Через M проведена прямая MN ∥ BC, N лежит на AC. AC = 22 см. Найди AN.", ["22 см", "44 см", "5,5 см", "11 см"], 3, "Через A мысленно проведём прямую, параллельную BC. Три параллельные прямые отсекают на AB равные отрезки AM и MB. По теореме Фалеса AN = NC. Поэтому AN = 22 : 2 = 11 см."], ["В трапеции ABCD основания AD и BC параллельны. M — середина AB. Через M проведена параллель основаниям, пересекающая CD в N. CD = 16 см. Найди CN.", ["8 см", "16 см", "4 см", "12 см"], 0, "Основания и MN — три параллельные прямые. AM = MB. По теореме Фалеса CN = ND. Значит, CN = 16 : 2 = 8 см."], ["В треугольнике ABC сторона AB разделена на три равные части. Через точки деления проведены параллели BC до AC. AC = 24 см. Как далеко от A находится вторая точка деления AC?", ["8 см", "16 см", "12 см", "18 см"], 1, "Через A мысленно проводим параллель BC. По теореме Фалеса AC разделена на три равные части. Одна часть 24 : 3 = 8 см. До второй точки 2 · 8 = 16 см."], ["Четыре параллельные прямые отсекают на первой секущей три равные части. На второй крайние точки удалены на 6x + 9 см, а одна часть равна 3x − 1 см. Найди длину всего отрезка.", ["12 см", "27 см", "33 см", "36 см"], 2, "На второй секущей три равные части. Составляем уравнение: 3(3x − 1) = 6x + 9. Получаем 9x − 3 = 6x + 9, 3x = 12, x = 4. Весь отрезок: 6 · 4 + 9 = 33 см."]];
let order=q.map((_,i)=>i), n=0, a={};const el=document.getElementById('quiz');
function node(tag,txt,cls,parent=el){const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;parent.append(e);return e;}
function explain(t,parent){node('h3','Разберёмся по шагам','',parent);const steps=t[3].split(/(?<=\.)\s+(?=[А-ЯЁA-Z√])|;\s*/).filter(Boolean);const list=node('ol','','',parent);steps.forEach(x=>node('li',x,'',list));}
function draw(){const idx=order[n],t=q[idx],v=a[idx];el.innerHTML=`<small>Задание ${idx+1} · ${n+1} из ${order.length}</small><div class="bar"><div class="fill" style="width:${(n+1)/order.length*100}%"></div></div>`;node('small',idx<4?'Вспоминаем':idx<10?'Применяем':'Решаем сложные задачи');node('h2',t[0]);
if(idx<10){const f=node("div","","");f.innerHTML="<svg viewBox=\"0 0 340 210\" aria-label=\"Три параллельные прямые и две секущие\"><g stroke=\"#638db5\" stroke-width=\"2\" fill=\"none\"><path d=\"M30 10L110 200M30 10L310 200\"/></g><g stroke=\"#b99a55\" stroke-width=\"2\"><path d=\"M20 60H325M20 115H325M20 170H325\"/></g><text x=\"26.05263157894737\" y=\"54\" fill=\"#203b58\">A1</text><text x=\"110.6842105263158\" y=\"54\" fill=\"#203b58\">B1</text><text x=\"49.21052631578948\" y=\"109\" fill=\"#203b58\">A2</text><text x=\"191.73684210526315\" y=\"109\" fill=\"#203b58\">B2</text><text x=\"72.36842105263158\" y=\"164\" fill=\"#203b58\">A3</text><text x=\"272.7894736842105\" y=\"164\" fill=\"#203b58\">B3</text></svg>";}
t[1].forEach((s,i)=>{const b=node('button','АБВГ'[i]+'. '+s,'opt '+(v!==undefined?(i===t[2]?'good':i===v?'bad':''):''));b.disabled=v!==undefined;b.onclick=()=>{a[idx]=i;draw();};});
if(v!==undefined){const f=node('div','','feedback');f.setAttribute('role','status');node('strong',v===t[2]?'Верно!':'Пока неверно — посмотрим решение.','',f);node('p','Твой ответ: '+t[1][v],'',f);node('p','Правильный ответ: '+t[1][t[2]],'correct',f);explain(t,f);}
const nav=node('div','','nav');const back=node('button','Назад','',nav);back.disabled=n===0;back.onclick=()=>{n--;draw()};const next=node('button',n===order.length-1?'Результат':'Далее →','primary',nav);next.disabled=v===undefined;next.onclick=()=>{if(n+1<order.length){n++;draw()}else result()};}
function reset(ids){order=ids;n=0;a={};draw();}
function result(){const wrong=order.filter(i=>a[i]!==q[i][2]);el.replaceChildren();node('small','ТВОЙ РЕЗУЛЬТАТ');node('h1',`${order.length-wrong.length} из ${order.length}`);node('p',wrong.length?'Повтори задания, в которых ошибся.':'Отличная работа!');wrong.forEach(i=>{const f=node('div','','feedback');node('h3',`${i+1}. ${q[i][0]}`,'',f);node('p','Твой ответ: '+q[i][1][a[i]],'',f);node('p','Правильный ответ: '+q[i][1][q[i][2]],'correct',f);explain(q[i],f)});const nav=node('div','','nav');if(wrong.length)node('button','Повторить только ошибки','primary',nav).onclick=()=>reset(wrong);node('button','Пройти все 15 заново','',nav).onclick=()=>reset(q.map((_,i)=>i));}draw();
</script></html>
