<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Теорема Пифагора</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f6fb;color:#203b58;font:17px system-ui}main{max-width:780px;margin:24px auto;padding:22px}header,section{background:white;border:1px solid #dce7f1;border-radius:24px;padding:26px;margin-bottom:18px}small{color:#587a9a}h1{font-size:clamp(25px,5vw,38px);margin:12px 0}h2{font-size:23px}button{font:inherit;cursor:pointer;border:1px solid #cbddeb;border-radius:12px;padding:14px;background:#f6faff;color:#203b58}button:hover{background:#e4eff9}button:disabled{cursor:default} .opt{display:block;width:100%;text-align:left;margin:9px 0}.good{background:#e0f3e8!important;border-color:#64a681}.bad{background:#fae7e5!important;border-color:#c88179}.primary{background:#244a70;color:white}.primary:disabled{opacity:.45}.bar{height:8px;background:#e4edf5;border-radius:8px;overflow:hidden}.fill{height:100%;background:#86afd1}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}#feedback{background:#edf5fc;border-radius:12px;padding:15px;margin-top:15px}svg{max-width:320px;width:100%;display:block;margin:12px auto}footer{text-align:center;color:#587a9a;font-size:13px}.feedback{background:#edf5fc;border:1px solid #d5e5f3;border-radius:14px;padding:18px;margin-top:16px;color:#203b58}.feedback p,.feedback li{line-height:1.65;margin:8px 0}.feedback h3{font-size:18px;margin:14px 0 8px}.correct{color:#286344;font-weight:600}.nav{flex-wrap:wrap}@media(max-width:480px){main{padding:10px;margin:8px auto}header,section{padding:16px}} </style><main><header><small>ПОНЯТНАЯ МАТЕМАТИКА · 8 КЛАСС</small><h1>Теорема Пифагора</h1><small>30 заданий · от простого к сложному</small><svg viewBox="0 0 240 150"><path d="M30 20V120H210Z" fill="#DFECF8" stroke="#638DB5" stroke-width="2"/><path d="M30 108H42V120" fill="none" stroke="#B99A55" stroke-width="2"/><g fill="#203B58"><text x="15" y="18">A</text><text x="215" y="125">B</text><text x="15" y="138">C</text></g></svg><p>Прямоугольный треугольник: катеты образуют угол 90°, гипотенуза лежит напротив него.</p></header><section id="quiz"></section><footer>Спокойно · по шагам · с результатом</footer></main><script>
const q=[["Какой треугольник называется прямоугольным?", ["С одним углом 90°", "С двумя прямыми углами", "С равными сторонами", "С углом 60°"], 0, "Прямоугольный треугольник имеет один прямой угол. Два других угла острые, их сумма 90°.", null], ["Какие стороны называются катетами?", ["Две самые длинные стороны", "Стороны, образующие прямой угол", "Стороны, образующие острый угол", "Любые две стороны"], 1, "Катеты пересекаются под углом 90°. Третья сторона — гипотенуза.", null], ["Где находится гипотенуза?", ["Напротив меньшего угла", "Всегда горизонтально", "Напротив прямого угла", "Всегда вертикально"], 2, "Найди прямой угол. Сторона, не примыкающая к нему, — гипотенуза.", null], ["На чертеже угол C прямой. Назови гипотенузу.", ["AC", "BC", "Все стороны", "AB"], 3, "Сторона AB лежит напротив вершины C. Поэтому AB — гипотенуза.", 0], ["На чертеже угол A прямой. Назови катеты.", ["AB и AC", "AB и BC", "AC и BC", "Только BC"], 0, "Катеты выходят из вершины прямого угла A. Это AB и AC.", 1], ["На чертеже угол B прямой. Назови гипотенузу.", ["AB", "AC", "BC", "Нельзя определить"], 1, "Гипотенуза лежит напротив B. Положение стороны на рисунке не имеет значения.", 2], ["Какая сторона прямоугольного треугольника самая длинная?", ["Первый катет", "Второй катет", "Гипотенуза", "Все равны"], 2, "Гипотенуза лежит напротив наибольшего угла — 90°. Поэтому она длиннее каждого катета.", null], ["Выбери теорему Пифагора, если c — гипотенуза.", ["c = a + b", "c² = a² − b²", "c² = (a + b)²", "c² = a² + b²"], 3, "Квадрат гипотенузы равен сумме квадратов катетов. Складываем именно квадраты.", null], ["Как найти катет a, если известны c и b?", ["a = √(c² − b²)", "a = c − b", "a = √(c² + b²)", "a = c² − b²"], 0, "Из c² = a² + b² получаем a² = c² − b². Извлекаем положительный квадратный корень.", null], ["Можно ли применять теорему Пифагора к любому треугольнику?", ["Да", "Нет, только к прямоугольному", "Только к равностороннему", "Только к равнобедренному"], 1, "Перед применением теоремы убедись, что один угол равен 90°.", null], ["Катеты равны 3 и 4 см. Найди гипотенузу.", ["7 см", "25 см", "5 см", "4 см"], 2, "c² = 3² + 4² = 9 + 16 = 25. c = √25 = 5 см.", null], ["Катеты равны 6 и 8 см. Найди гипотенузу.", ["14 см", "100 см", "8 см", "10 см"], 3, "c² = 6² + 8² = 36 + 64 = 100. c = √100 = 10 см.", null], ["Катеты равны 5 и 12 см. Найди гипотенузу.", ["13 см", "17 см", "169 см", "12 см"], 0, "c² = 5² + 12² = 25 + 144 = 169. c = √169 = 13 см.", null], ["Катеты равны 8 и 15 см. Найди гипотенузу.", ["23 см", "17 см", "289 см", "15 см"], 1, "c² = 8² + 15² = 64 + 225 = 289. c = √289 = 17 см.", null], ["Гипотенуза 15 см, один катет 12 см. Найди второй катет.", ["3 см", "81 см", "9 см", "27 см"], 2, "a² = 15² − 12² = 225 − 144 = 81. a = √81 = 9 см.", null], ["Гипотенуза 25 см, один катет 24 см. Найди второй катет.", ["1 см", "49 см", "49 см", "7 см"], 3, "a² = 25² − 24² = 625 − 576 = 49. a = √49 = 7 см.", null], ["Катеты равны 2 и 3 см. Найди гипотенузу.", ["√13 см", "5 см", "13 см", "√5 см"], 0, "c² = 4 + 9 = 13. c = √13 см. Корень не извлекается нацело.", null], ["Катеты равны 6 и 6 см. Найди гипотенузу.", ["12 см", "6√2 см", "72 см", "3√2 см"], 1, "c² = 36 + 36 = 72. c = √72 = 6√2 см.", null], ["Является ли треугольник со сторонами 9, 40, 41 прямоугольным?", ["Нет", "Только если равнобедренный", "Да", "Недостаточно данных"], 2, "41² = 1681. 9² + 40² = 81 + 1600 = 1681. По обратной теореме Пифагора треугольник прямоугольный.", null], ["Какая тройка не является пифагоровой?", ["3, 4, 5", "5, 12, 13", "8, 15, 17", "4, 5, 6"], 3, "Для 4, 5, 6: 16 + 25 = 41, а 6² = 36. Равенства нет.", null], ["Сторона квадрата 7 см. Найди диагональ.", ["7√2 см", "14 см", "49 см", "7 см"], 0, "Диагональ образует прямоугольный треугольник с катетами 7 и 7. d² = 49 + 49 = 98. d = 7√2 см.", null], ["Диагональ прямоугольника 13 см, ширина 5 см. Найди длину.", ["8 см", "12 см", "18 см", "144 см"], 1, "Диагональ — гипотенуза. Длина равна √(169 − 25) = √144 = 12 см.", null], ["Боковые стороны равнобедренного треугольника по 13 см, основание 10 см. Найди высоту к основанию.", ["3 см", "5 см", "12 см", "√69 см"], 2, "Высота делит основание пополам: 10 : 2 = 5. h² = 169 − 25 = 144. h = 12 см.", null], ["Диагонали ромба 16 и 30 см. Найди сторону.", ["34 см", "23 см", "46 см", "17 см"], 3, "Диагонали ромба перпендикулярны и делятся пополам. Катеты 8 и 15. Сторона равна √(64 + 225) = 17 см.", null], ["Основания равнобедренной трапеции 20 и 8 см, боковая сторона 10 см. Найди высоту.", ["8 см", "6 см", "10 см", "4 см"], 0, "Опустим две высоты из концов меньшего основания. Горизонтальный катет (20 − 8) : 2 = 6. h = √(100 − 36) = 8 см.", null], ["Лестница длиной 10 м стоит у вертикальной стены. Нижний конец в 6 м от стены. На какой высоте верхний конец?", ["4 м", "8 м", "16 м", "64 м"], 1, "Лестница — гипотенуза. h² = 100 − 36 = 64. h = 8 м.", null], ["Катеты относятся как 3 : 4, гипотенуза 35 см. Найди катеты.", ["15 и 20 см", "7 и 28 см", "21 и 28 см", "18 и 24 см"], 2, "Пусть катеты 3x и 4x. 9x² + 16x² = 1225. 25x² = 1225, x = 7. Катеты 21 и 28 см.", null], ["Катеты прямоугольного треугольника 9 и 12 см. Найди высоту к гипотенузе.", ["15 см", "6 см", "10,8 см", "7,2 см"], 3, "Гипотенуза √(81 + 144) = 15. Площадь 9 · 12 : 2 = 54. Из 15h : 2 = 54 получаем h = 108 : 15 = 7,2 см.", null], ["Диагональ квадрата 12 см. Найди площадь квадрата.", ["72 см²", "144 см²", "36 см²", "24 см²"], 0, "Если сторона a, то 2a² = 12² = 144. Площадь S = a² = 72 см².", null], ["Периметр равнобедренного треугольника 50 см, основание 14 см. Найди площадь.", ["70√11 см²", "35√11 см²", "126 см²", "35 см²"], 1, "Боковая сторона (50 − 14) : 2 = 18. Половина основания 7. Высота √(324 − 49) = √275 = 5√11. S = 14 · 5√11 : 2 = 35√11 см².", null]];
const figs=["<svg viewBox=\"0 0 240 150\"><path d=\"M30 20V120H210Z\" fill=\"#DFECF8\" stroke=\"#638DB5\" stroke-width=\"2\"/><path d=\"M30 108H42V120\" fill=\"none\" stroke=\"#B99A55\" stroke-width=\"2\"/><g fill=\"#203B58\"><text x=\"15\" y=\"18\">A</text><text x=\"215\" y=\"125\">B</text><text x=\"15\" y=\"138\">C</text></g></svg>", "<svg viewBox=\"0 0 240 150\"><path d=\"M120 20L20 120H220Z\" fill=\"#DFECF8\" stroke=\"#638DB5\" stroke-width=\"2\"/><path d=\"M110 30L120 40L130 30\" fill=\"none\" stroke=\"#B99A55\" stroke-width=\"2\"/><g fill=\"#203B58\"><text x=\"115\" y=\"15\">A</text><text x=\"5\" y=\"135\">B</text><text x=\"225\" y=\"135\">C</text></g></svg>", "<svg viewBox=\"0 0 240 180\"><path d=\"M40 15V165L115 90Z\" fill=\"#DFECF8\" stroke=\"#638DB5\" stroke-width=\"2\"/><path d=\"M105 80L95 90L105 100\" fill=\"none\" stroke=\"#B99A55\" stroke-width=\"2\"/><g fill=\"#203B58\"><text x=\"25\" y=\"15\">A</text><text x=\"125\" y=\"95\">B</text><text x=\"25\" y=\"175\">C</text></g></svg>"];
let order=q.map((_,i)=>i), n=0, a={};const el=document.getElementById('quiz');
function node(tag,txt,cls,parent=el){const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;parent.append(e);return e;}
function explain(t,parent){node('h3','Разберёмся по шагам','',parent);const steps=t[3].split(/(?<=\.)\s+(?=[А-ЯЁA-Z√])|;\s*/).filter(Boolean);const list=node('ol','','',parent);steps.forEach(x=>node('li',x,'',list));}
function draw(){const idx=order[n],t=q[idx],v=a[idx];el.innerHTML=`<small>Задание ${idx+1} · ${n+1} из ${order.length}</small><div class="bar"><div class="fill" style="width:${(n+1)/order.length*100}%"></div></div>`;node('small',idx<10?'Вспоминаем':idx<20?'Применяем':'Решаем сложные задачи');node('h2',t[0]);if(t[4]!==null){const d=node('div','');d.innerHTML=figs[t[4]];}
t[1].forEach((s,i)=>{const b=node('button','АБВГ'[i]+'. '+s,'opt '+(v!==undefined?(i===t[2]?'good':i===v?'bad':''):''));b.disabled=v!==undefined;b.onclick=()=>{a[idx]=i;draw();};});
if(v!==undefined){const f=node('div','','feedback');f.setAttribute('role','status');node('strong',v===t[2]?'Верно!':'Пока неверно — посмотрим решение.','',f);node('p','Твой ответ: '+t[1][v],'',f);node('p','Правильный ответ: '+t[1][t[2]],'correct',f);explain(t,f);}
const nav=node('div','','nav');const back=node('button','Назад','',nav);back.disabled=n===0;back.onclick=()=>{n--;draw()};const next=node('button',n===order.length-1?'Результат':'Далее →','primary',nav);next.disabled=v===undefined;next.onclick=()=>{if(n+1<order.length){n++;draw()}else result()};}
function reset(ids){order=ids;n=0;a={};draw();}
function result(){const wrong=order.filter(i=>a[i]!==q[i][2]);el.replaceChildren();node('small','ТВОЙ РЕЗУЛЬТАТ');node('h1',`${order.length-wrong.length} из ${order.length}`);node('p',wrong.length?'Повтори задания, в которых ошибся.':'Отличная работа!');wrong.forEach(i=>{const f=node('div','','feedback');node('h3',`${i+1}. ${q[i][0]}`,'',f);node('p','Твой ответ: '+q[i][1][a[i]],'',f);node('p','Правильный ответ: '+q[i][1][q[i][2]],'correct',f);explain(q[i],f)});const nav=node('div','','nav');if(wrong.length)node('button','Повторить только ошибки','primary',nav).onclick=()=>reset(wrong);node('button','Пройти все 30 заново','',nav).onclick=()=>reset(q.map((_,i)=>i));}draw();
</script></html>
