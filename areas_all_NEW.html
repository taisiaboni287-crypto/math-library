<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Площади многоугольников</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f6fb;color:#203b58;font:17px system-ui}main{max-width:780px;margin:24px auto;padding:22px}header,section{background:white;border:1px solid #dce7f1;border-radius:24px;padding:26px;margin-bottom:18px}small{color:#587a9a}h1{font-size:clamp(25px,5vw,38px);margin:12px 0}h2{font-size:23px}button{font:inherit;cursor:pointer;border:1px solid #cbddeb;border-radius:12px;padding:14px;background:#f6faff;color:#203b58}button:hover{background:#e4eff9}button:disabled{cursor:default} .opt{display:block;width:100%;text-align:left;margin:9px 0}.good{background:#e0f3e8!important;border-color:#64a681}.bad{background:#fae7e5!important;border-color:#c88179}.primary{background:#244a70;color:white}.primary:disabled{opacity:.45}.bar{height:8px;background:#e4edf5;border-radius:8px;overflow:hidden}.fill{height:100%;background:#86afd1}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}#feedback{background:#edf5fc;border-radius:12px;padding:15px;margin-top:15px}svg{max-width:320px;width:100%;display:block;margin:12px auto}footer{text-align:center;color:#587a9a;font-size:13px}.feedback{background:#edf5fc;border:1px solid #d5e5f3;border-radius:14px;padding:18px;margin-top:16px;color:#203b58}.feedback p,.feedback li{line-height:1.65;margin:8px 0}.feedback h3{font-size:18px;margin:14px 0 8px}.correct{color:#286344;font-weight:600}.nav{flex-wrap:wrap}@media(max-width:480px){main{padding:10px;margin:8px auto}header,section{padding:16px}} </style><main><header><small>ПОНЯТНАЯ МАТЕМАТИКА · 8 КЛАСС</small><h1>Площади многоугольников</h1><small>Итоговый тренажёр · 25 заданий · от простого к сложному</small><svg viewBox="0 0 320 130" role="img" aria-label="Шесть геометрических фигур"><g fill="#e1effa" stroke="#638db5" stroke-width="2"><rect x="10" y="10" width="85" height="45"/><rect x="135" y="10" width="45" height="45"/><path d="M215 55H285L305 10H235Z"/><path d="M10 95L52 65L94 95L52 125Z"/><path d="M115 125H205L150 65Z"/><path d="M220 125H310L290 65H245Z"/></g></svg></header><section id="quiz"></section><footer>Спокойно · по шагам · с результатом</footer></main><script>
const q=[["Какая формула площади треугольника верна?", ["ah", "ah : 2", "2ah", "a + h"], 1, "Выбери основание a и соответствующую высоту h. Площадь треугольника составляет половину площади параллелограмма с таким же основанием и высотой. S = ah : 2."], ["Как найти площадь ромба по диагоналям?", ["d₁d₂", "2(d₁ + d₂)", "d₁d₂ : 2", "d₁ + d₂"], 2, "Диагонали ромба перпендикулярны. Площадь равна половине произведения полных диагоналей: S = d₁d₂ : 2."], ["Какие стороны трапеции называются основаниями?", ["Параллельные стороны", "Равные стороны", "Боковые стороны", "Диагонали"], 0, "Трапеция имеет ровно одну пару параллельных противоположных сторон. Именно они называются основаниями."], ["Сколько высот можно провести из одной вершины параллелограмма к прямым, содержащим две противоположные этой вершине стороны?", ["Одну", "Три", "Четыре", "Две"], 3, "Из вершины к каждой из двух прямых можно провести ровно один перпендикуляр. Получаем две высоты, иногда к продолжению стороны."], ["Какая формула площади квадрата со стороной a верна?", ["4a", "2a²", "a²", "a : 2"], 2, "Квадрат — прямоугольник с равными сторонами. S = a · a = a². Не путай площадь с периметром 4a."], ["Прямоугольник: стороны 7 и 9 см. Найди площадь.", ["32 см²", "63 см²", "16 см²", "126 см²"], 1, "S = ab. S = 7 · 9 = 63 см²."], ["Квадрат: сторона 11 см. Найди площадь.", ["121 см²", "44 см²", "22 см²", "110 см²"], 0, "S = a². S = 11 · 11 = 121 см²."], ["Параллелограмм: основание 13 см, высота 4 см. Найди площадь.", ["26 см²", "17 см²", "34 см²", "52 см²"], 3, "S = ah. S = 13 · 4 = 52 см²."], ["Треугольник: основание 14 см, высота 6 см. Найди площадь.", ["84 см²", "42 см²", "20 см²", "40 см²"], 1, "S = ah : 2. S = 14 · 6 : 2 = 42 см²."], ["Ромб: диагонали 12 и 16 см. Найди площадь.", ["192 см²", "28 см²", "96 см²", "48 см²"], 2, "S = d₁d₂ : 2. S = 12 · 16 : 2 = 96 см²."], ["Трапеция: основания 8 и 14 см, высота 5 см. Найди площадь.", ["55 см²", "110 см²", "40 см²", "70 см²"], 0, "Найдём полусумму оснований: (8 + 14) : 2 = 11 см. S = 11 · 5 = 55 см²."], ["Ромб: сторона 9 см, высота 4 см. Найди площадь.", ["18 см²", "81 см²", "26 см²", "36 см²"], 3, "Ромб — параллелограмм. S = ah = 9 · 4 = 36 см²."], ["Площадь треугольника 48 см², основание 12 см. Найди высоту.", ["4 см", "8 см", "6 см", "12 см"], 1, "Из S = ah : 2 получаем h = 2S : a. h = 96 : 12 = 8 см."], ["Периметр квадрата 36 см. Найди площадь.", ["36 см²", "144 см²", "81 см²", "9 см²"], 2, "Сторона равна 36 : 4 = 9 см. S = 9² = 81 см²."], ["Площади многоугольников 84 см², высота 7 см, одно основание 10 см. Найди второе.", ["14 см", "12 см", "24 см", "2 см"], 0, "Сумма оснований равна 2S : h = 168 : 7 = 24 см. Второе основание равно 24 − 10 = 14 см."], ["Стороны параллелограмма 15 и 10 см. Высота к большей стороне 4 см. Найди высоту к меньшей.", ["4 см", "10 см", "9 см", "6 см"], 3, "S = 15 · 4 = 60 см². Высота к меньшей стороне равна 60 : 10 = 6 см."], ["Площадь ромба 60 см², одна диагональ 10 см. Найди другую.", ["6 см", "12 см", "24 см", "5 см"], 1, "Из S = d₁d₂ : 2 получаем d₂ = 2S : d₁. d₂ = 120 : 10 = 12 см."], ["Сторону квадрата увеличили в 3 раза. Как изменилась площадь?", ["В 3 раза", "В 6 раз", "В 9 раз", "Не изменилась"], 2, "Новая площадь равна (3a)² = 9a². Площадь увеличилась в 9 раз."], ["Средняя линия трапеции 1,2 дм, высота 5 см. Найди площадь в см².", ["60 см²", "6 см²", "30 см²", "600 см²"], 0, "Переведём единицы: 1,2 дм = 12 см. S = mh = 12 · 5 = 60 см²."], ["Диагональ прямоугольника 13 см, сторона 5 см. Найди площадь.", ["65 см²", "30 см²", "90 см²", "60 см²"], 3, "По теореме Пифагора вторая сторона равна √(13² − 5²) = 12 см. S = 5 · 12 = 60 см²."], ["Сторона ромба 10 см, одна диагональ 12 см. Найди площадь.", ["48 см²", "96 см²", "192 см²", "120 см²"], 1, "Половина первой диагонали равна 6 см. Половина второй равна √(10² − 6²) = 8 см. Полная вторая диагональ равна 16 см. S = 12 · 16 : 2 = 96 см²."], ["Стороны параллелограмма 8 и 15 см, угол между ними 30°. Найди площадь.", ["120 см²", "30 см²", "60 см²", "46 см²"], 2, "Высота к стороне 15 см — катет напротив угла 30°. h = 8 : 2 = 4 см. S = 15 · 4 = 60 см²."], ["Равнобедренная трапеция: основания 10 и 22 см, боковая сторона 10 см. Найди площадь.", ["128 см²", "160 см²", "96 см²", "256 см²"], 0, "Проекция боковой стороны равна (22 − 10) : 2 = 6 см. Высота равна √(10² − 6²) = 8 см. S = (10 + 22) : 2 · 8 = 128 см²."], ["Из прямоугольника 12 × 8 см вырезали прямоугольный треугольник с катетами 6 и 4 см. Найди площадь оставшейся фигуры.", ["72 см²", "96 см²", "12 см²", "84 см²"], 3, "Площадь прямоугольника равна 12 · 8 = 96 см². Площадь вырезанного треугольника равна 6 · 4 : 2 = 12 см². Осталось 96 − 12 = 84 см²."], ["Длина прямоугольника на 5 см больше ширины, площадь 84 см². Найди стороны.", ["6 и 11 см", "7 и 12 см", "8 и 13 см", "4 и 21 см"], 1, "Пусть ширина x см, тогда длина x + 5 см. Составим уравнение x(x + 5) = 84. Получаем x² + 5x − 84 = 0, или (x − 7)(x + 12) = 0. Отрицательный корень не подходит. Стороны 7 и 12 см."]];
let order=q.map((_,i)=>i), n=0, a={};const el=document.getElementById('quiz');
function node(tag,txt,cls,parent=el){const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;parent.append(e);return e;}
function explain(t,parent){node('h3','Разберёмся по шагам','',parent);const steps=t[3].split(/(?<=\.)\s+(?=[А-ЯЁA-Z√])|;\s*/).filter(Boolean);const list=node('ol','','',parent);steps.forEach(x=>node('li',x,'',list));}
function draw(){const idx=order[n],t=q[idx],v=a[idx];el.innerHTML=`<small>Задание ${idx+1} · ${n+1} из ${order.length}</small><div class="bar"><div class="fill" style="width:${(n+1)/order.length*100}%"></div></div>`;node('small',idx<5?'Вспоминаем':idx<12?'Применяем':idx<19?'Рассуждаем':'Решаем сложные задачи');node('h2',t[0]);
t[1].forEach((s,i)=>{const b=node('button','АБВГ'[i]+'. '+s,'opt '+(v!==undefined?(i===t[2]?'good':i===v?'bad':''):''));b.disabled=v!==undefined;b.onclick=()=>{a[idx]=i;draw();};});
if(v!==undefined){const f=node('div','','feedback');f.setAttribute('role','status');node('strong',v===t[2]?'Верно!':'Пока неверно — посмотрим решение.','',f);node('p','Твой ответ: '+t[1][v],'',f);node('p','Правильный ответ: '+t[1][t[2]],'correct',f);explain(t,f);}
const nav=node('div','','nav');const back=node('button','Назад','',nav);back.disabled=n===0;back.onclick=()=>{n--;draw()};const next=node('button',n===order.length-1?'Результат':'Далее →','primary',nav);next.disabled=v===undefined;next.onclick=()=>{if(n+1<order.length){n++;draw()}else result()};}
function reset(ids){order=ids;n=0;a={};draw();}
function result(){const wrong=order.filter(i=>a[i]!==q[i][2]);el.replaceChildren();node('small','ТВОЙ РЕЗУЛЬТАТ');node('h1',`${order.length-wrong.length} из ${order.length}`);node('p',wrong.length?'Повтори задания, в которых ошибся.':'Отличная работа!');wrong.forEach(i=>{const f=node('div','','feedback');node('h3',`${i+1}. ${q[i][0]}`,'',f);node('p','Твой ответ: '+q[i][1][a[i]],'',f);node('p','Правильный ответ: '+q[i][1][q[i][2]],'correct',f);explain(q[i],f)});const nav=node('div','','nav');if(wrong.length)node('button','Повторить только ошибки','primary',nav).onclick=()=>reset(wrong);node('button','Пройти все 25 заново','',nav).onclick=()=>reset(q.map((_,i)=>i));}draw();
</script></html>
