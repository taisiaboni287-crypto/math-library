<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Площадь треугольника — без синусов</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f6fb;color:#203b58;font:17px system-ui}main{max-width:780px;margin:24px auto;padding:22px}header,section{background:white;border:1px solid #dce7f1;border-radius:24px;padding:26px;margin-bottom:18px}small{color:#587a9a}h1{font-size:clamp(25px,5vw,38px);margin:12px 0}h2{font-size:23px}button{font:inherit;cursor:pointer;border:1px solid #cbddeb;border-radius:12px;padding:14px;background:#f6faff;color:#203b58}button:hover{background:#e4eff9}button:disabled{cursor:default} .opt{display:block;width:100%;text-align:left;margin:9px 0}.good{background:#e0f3e8!important;border-color:#64a681}.bad{background:#fae7e5!important;border-color:#c88179}.primary{background:#244a70;color:white}.primary:disabled{opacity:.45}.bar{height:8px;background:#e4edf5;border-radius:8px;overflow:hidden}.fill{height:100%;background:#86afd1}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}#feedback{background:#edf5fc;border-radius:12px;padding:15px;margin-top:15px}svg{max-width:320px;width:100%;display:block;margin:12px auto}footer{text-align:center;color:#587a9a;font-size:13px}.feedback{background:#edf5fc;border:1px solid #d5e5f3;border-radius:14px;padding:18px;margin-top:16px;color:#203b58}.feedback p,.feedback li{line-height:1.65;margin:8px 0}.feedback h3{font-size:18px;margin:14px 0 8px}.correct{color:#286344;font-weight:600}.nav{flex-wrap:wrap}@media(max-width:480px){main{padding:10px;margin:8px auto}header,section{padding:16px}} </style><main><header><small>ПОНЯТНАЯ МАТЕМАТИКА · 8 КЛАСС</small><h1>Площадь треугольника — без синусов</h1><small>Все способы решения · 25 заданий · от простого к сложному</small><svg viewBox="0 0 320 130"><path d="M25 110H295L120 15Z" fill="#e1effa" stroke="#638db5" stroke-width="2"/><path d="M120 15V110" stroke="#b99a55" stroke-dasharray="5 4" stroke-width="2"/><path d="M120 100H130V110" fill="none" stroke="#b99a55"/><text x="105" y="70" fill="#203b58">h</text><text x="155" y="125" fill="#203b58">a</text></svg></header><section id="quiz"></section><footer>Спокойно · по шагам · с результатом</footer></main><script>
const q=[["Как вычислить площадь произвольного треугольника?", ["ah", "ah/2", "2ah", "a+h"], 1, "Выбери основание a и высоту h, проведённую к нему. Умножь их и раздели на 2."], ["Сколько высот можно провести в треугольнике из трёх его вершин?", ["2", "1", "3", "6"], 2, "Из каждой вершины проводится один перпендикуляр к прямой противоположной стороны. Всего три высоты."], ["Как найти площадь прямоугольного треугольника по катетам a и b?", ["ab/2", "ab", "(a+b)/2", "2ab"], 0, "Катеты перпендикулярны. Один катет является основанием, другой — высотой. S = ab/2."], ["Может ли высота проходить вне треугольника?", ["Только в прямоугольном", "Нет", "Только в равностороннем", "Да"], 3, "В тупоугольном треугольнике две высоты проходят вне фигуры. Их основания лежат на продолжениях сторон."], ["На какие части медиана делит треугольник?", ["Всегда на два равных треугольника", "На два равновеликих треугольника", "На части с отношением площадей 1:2", "На три части"], 1, "Медиана делит сторону пополам. Полученные треугольники имеют равные основания и общую высоту. Их площади равны."], ["Основание 12 см, высота 7 см. Найди площадь.", ["19 см²", "84 см²", "42 см²", "38 см²"], 2, "S = ah/2. Подставим числа: S = 12 · 7 : 2 = 42 см²."], ["Катеты равны 9 и 8 см. Найди площадь.", ["36 см²", "72 см²", "17 см²", "34 см²"], 0, "Катеты являются основанием и высотой. S = 9 · 8 : 2 = 36 см²."], ["Площадь 54 см², основание 12 см. Найди высоту.", ["6 см", "4,5 см", "18 см", "9 см"], 3, "Из S = ah/2 получаем h = 2S/a. h = 108 : 12 = 9 см."], ["Площадь прямоугольного треугольника 30 см², катет 5 см. Найди другой катет.", ["6 см", "12 см", "15 см", "25 см"], 1, "Удвоенная площадь равна произведению катетов. b = 2 · 30 : 5 = 12 см."], ["Основание 1,4 дм, высота 6 см. Найди площадь в см².", ["84 см²", "4,2 см²", "42 см²", "420 см²"], 2, "Переведём 1,4 дм в 14 см. S = 14 · 6 : 2 = 42 см²."], ["Высоты двух треугольников равны, основания относятся как 3:5. Как относятся площади?", ["3:5", "9:25", "5:3", "1:1"], 0, "При делении формул площадей общая высота и множитель 1/2 сокращаются. Остаётся отношение оснований 3:5."], ["Основания равны, высоты 4 и 10 см. Как относится первая площадь ко второй?", ["1:1", "5:2", "4:25", "2:5"], 3, "При равных основаниях площади относятся как высоты. 4:10 = 2:5."], ["Медиана проведена в треугольнике площадью 76 см². Найди площадь каждой части.", ["19 см²", "38 см²", "76 см²", "25 см²"], 1, "Медиана делит треугольник на равновеликие части. 76 : 2 = 38 см²."], ["У двух треугольников есть равные углы. Стороны, заключающие эти углы, равны 4 и 6 см, 8 и 9 см соответственно. Найди отношение площадей.", ["1:2", "2:3", "1:3", "3:1"], 2, "По теореме об отношении площадей при равных углах делим произведения заключающих их сторон. S₁:S₂ = (4 · 6):(8 · 9) = 24:72 = 1:3."], ["У двух треугольников равные углы. Стороны при них равны 3 и 8 см, 6 и 10 см. Площадь первого 12 см². Найди вторую.", ["30 см²", "24 см²", "48 см²", "4,8 см²"], 0, "S₁:S₂ = (3 · 8):(6 · 10) = 2:5. Одна доля равна 12 : 2 = 6 см². Вторая площадь 6 · 5 = 30 см²."], ["Гипотенуза 13 см, катет 5 см. Найди площадь.", ["65 см²", "32,5 см²", "60 см²", "30 см²"], 3, "По теореме Пифагора второй катет равен √(169 − 25) = 12 см. S = 5 · 12 : 2 = 30 см²."], ["Равнобедренный треугольник: боковые стороны 13 см, основание 10 см. Найди площадь.", ["65 см²", "60 см²", "120 см²", "30 см²"], 1, "Высота к основанию делит его пополам: 5 см. По теореме Пифагора h = √(169 − 25) = 12 см. S = 10 · 12 : 2 = 60 см²."], ["Две стороны 10 и 14 см образуют угол 30°. Найди площадь.", ["140 см²", "70 см²", "35 см²", "24 см²"], 2, "Проведём высоту к стороне 14 см. Катет напротив угла 30° равен половине гипотенузы 10 см: h = 5 см. S = 14 · 5 : 2 = 35 см²."], ["Равносторонний треугольник имеет сторону 8 см. Найди площадь.", ["16√3 см²", "32√3 см²", "16 см²", "64 см²"], 0, "Высота делит основание пополам: 4 см. h = √(64 − 16) = 4√3 см. S = 8 · 4√3 : 2 = 16√3 см²."], ["Точка D на стороне BC треугольника ABC делит её в отношении BD:DC = 2:3. Площадь ABC равна 85 см². Найди площадь ABD.", ["17 см²", "51 см²", "42,5 см²", "34 см²"], 3, "Треугольники ABD и ADC имеют общую высоту. Их площади относятся как 2:3. Одна доля равна 85 : 5 = 17 см². S(ABD) = 2 · 17 = 34 см²."], ["Формула Герона: S = √[p(p−a)(p−b)(p−c)]. Чему равен p при сторонах 5, 6 и 7 см?", ["18 см", "9 см", "6 см", "12 см"], 1, "p — полупериметр. p = (5 + 6 + 7) : 2 = 9 см."], ["По формуле Герона найди площадь треугольника со сторонами 5, 5 и 6 см.", ["15 см²", "24 см²", "12 см²", "8 см²"], 2, "p = (5 + 5 + 6) : 2 = 8 см. S = √(8 · 3 · 3 · 2) = √144 = 12 см²."], ["По формуле Герона найди площадь треугольника со сторонами 13, 14 и 15 см.", ["84 см²", "42 см²", "90 см²", "168 см²"], 0, "p = 21 см. S = √(21 · 8 · 7 · 6) = √7056 = 84 см²."], ["Формула Пика: S = В + Г/2 − 1. Внутри фигуры 3 узла, на границе 8 узлов единичной решётки. Найди площадь.", ["5", "7", "10", "6"], 3, "В — число внутренних узлов, Г — число всех граничных узлов, включая вершины. S = 3 + 8 : 2 − 1 = 6 квадратных единиц."], ["На рисунке треугольник с вершинами (0;0), (4;0), (0;3). Найди площадь по формуле Пика.", ["7", "6", "8", "12"], 1, "Внутренние узлы: (1;1), (1;2), (2;1) — всего 3. На границе 8 узлов, включая вершины. S = 3 + 8/2 − 1 = 6. Проверка: 4 · 3 : 2 = 6."]];
let order=q.map((_,i)=>i), n=0, a={};const el=document.getElementById('quiz');
function node(tag,txt,cls,parent=el){const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;parent.append(e);return e;}
function explain(t,parent){node('h3','Разберёмся по шагам','',parent);const steps=t[3].split(/(?<=\.)\s+(?=[А-ЯЁA-Z√])|;\s*/).filter(Boolean);const list=node('ol','','',parent);steps.forEach(x=>node('li',x,'',list));}
function draw(){const idx=order[n],t=q[idx],v=a[idx];el.innerHTML=`<small>Задание ${idx+1} · ${n+1} из ${order.length}</small><div class="bar"><div class="fill" style="width:${(n+1)/order.length*100}%"></div></div>`;node('small',idx<5?'Вспоминаем':idx<10?'Применяем':idx<15?'Отношения площадей':idx<20?'Сложные задачи':'Дополнительно: Герон и Пик');node('h2',t[0]);
if(idx===24){const f=node('div','','');f.innerHTML=`<svg viewBox="0 0 240 200" aria-label="Треугольник на единичной решётке"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#cbd9e6"/></pattern></defs><g transform="translate(40 20)"><rect width="160" height="120" fill="url(#grid)" stroke="#cbd9e6"/><path d="M0 0V120H160Z" fill="#b5d5ef" fill-opacity=".45" stroke="#638db5" stroke-width="2"/>${Array.from({length:5},(_,x)=>Array.from({length:4},(_,y)=>`<circle cx="${x*40}" cy="${y*40}" r="2.5" fill="#638db5"/>`).join('')).join('')}</g><text x="40" y="158">(0;0)</text><text x="185" y="158">(4;0)</text><text x="2" y="15">(0;3)</text></svg>`;} 
t[1].forEach((s,i)=>{const b=node('button','АБВГ'[i]+'. '+s,'opt '+(v!==undefined?(i===t[2]?'good':i===v?'bad':''):''));b.disabled=v!==undefined;b.onclick=()=>{a[idx]=i;draw();};});
if(v!==undefined){const f=node('div','','feedback');f.setAttribute('role','status');node('strong',v===t[2]?'Верно!':'Пока неверно — посмотрим решение.','',f);node('p','Твой ответ: '+t[1][v],'',f);node('p','Правильный ответ: '+t[1][t[2]],'correct',f);explain(t,f);}
const nav=node('div','','nav');const back=node('button','Назад','',nav);back.disabled=n===0;back.onclick=()=>{n--;draw()};const next=node('button',n===order.length-1?'Результат':'Далее →','primary',nav);next.disabled=v===undefined;next.onclick=()=>{if(n+1<order.length){n++;draw()}else result()};}
function reset(ids){order=ids;n=0;a={};draw();}
function result(){const wrong=order.filter(i=>a[i]!==q[i][2]);el.replaceChildren();node('small','ТВОЙ РЕЗУЛЬТАТ');node('h1',`${order.length-wrong.length} из ${order.length}`);node('p',wrong.length?'Повтори задания, в которых ошибся.':'Отличная работа!');wrong.forEach(i=>{const f=node('div','','feedback');node('h3',`${i+1}. ${q[i][0]}`,'',f);node('p','Твой ответ: '+q[i][1][a[i]],'',f);node('p','Правильный ответ: '+q[i][1][q[i][2]],'correct',f);explain(q[i],f)});const nav=node('div','','nav');if(wrong.length)node('button','Повторить только ошибки','primary',nav).onclick=()=>reset(wrong);node('button','Пройти все 25 заново','',nav).onclick=()=>reset(q.map((_,i)=>i));}draw();
</script></html>
