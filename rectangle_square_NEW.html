<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Площадь прямоугольника и квадрата</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f6fb;color:#203b58;font:17px system-ui}main{max-width:780px;margin:24px auto;padding:22px}header,section{background:white;border:1px solid #dce7f1;border-radius:24px;padding:26px;margin-bottom:18px}small{color:#587a9a}h1{font-size:clamp(25px,5vw,38px);margin:12px 0}h2{font-size:23px}button{font:inherit;cursor:pointer;border:1px solid #cbddeb;border-radius:12px;padding:14px;background:#f6faff;color:#203b58}button:hover{background:#e4eff9}button:disabled{cursor:default} .opt{display:block;width:100%;text-align:left;margin:9px 0}.good{background:#e0f3e8!important;border-color:#64a681}.bad{background:#fae7e5!important;border-color:#c88179}.primary{background:#244a70;color:white}.primary:disabled{opacity:.45}.bar{height:8px;background:#e4edf5;border-radius:8px;overflow:hidden}.fill{height:100%;background:#86afd1}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}#feedback{background:#edf5fc;border-radius:12px;padding:15px;margin-top:15px}svg{max-width:320px;width:100%;display:block;margin:12px auto}footer{text-align:center;color:#587a9a;font-size:13px}.feedback{background:#edf5fc;border:1px solid #d5e5f3;border-radius:14px;padding:18px;margin-top:16px;color:#203b58}.feedback p,.feedback li{line-height:1.65;margin:8px 0}.feedback h3{font-size:18px;margin:14px 0 8px}.correct{color:#286344;font-weight:600}.nav{flex-wrap:wrap}@media(max-width:480px){main{padding:10px;margin:8px auto}header,section{padding:16px}} </style><main><header><small>ПОНЯТНАЯ МАТЕМАТИКА · 8 КЛАСС</small><h1>Площадь прямоугольника и квадрата</h1><small>Обновлённая версия · 15 заданий · от простого к сложному</small><svg viewBox="0 0 320 125" role="img" aria-label="Прямоугольник и квадрат"><g fill="#e1effa" stroke="#638db5" stroke-width="2"><rect x="20" y="25" width="150" height="75" rx="1"/><rect x="215" y="25" width="75" height="75" rx="1"/></g><g fill="#244a70" font-size="15" text-anchor="middle"><text x="95" y="67"></text><text x="252" y="67"></text><text x="95" y="118">a</text><text x="252" y="118">a</text><text x="10" y="67">b</text><text x="304" y="67">a</text></g></svg></header><section id="quiz"></section><footer>Спокойно · по шагам · с результатом</footer></main><script>
const q=[["Какая формула площади прямоугольника?", ["S = 2(a + b)", "S = a · b", "S = a + b", "S = a · b : 2"], 1, "Площадь равна произведению длины и ширины."], ["Какая формула площади квадрата со стороной a?", ["S = 4a", "S = 2a", "S = a²", "S = a : 2"], 2, "У квадрата все стороны равны, поэтому S = a · a = a²."], ["Почему формулу площади прямоугольника можно применять к квадрату?", ["У квадрата нет прямых углов", "У них всегда одинаковый периметр", "У квадрата четыре разные стороны", "Квадрат — прямоугольник с равными сторонами"], 3, "Квадрат является частным случаем прямоугольника: все углы прямые, а стороны равны."], ["В каких единицах измеряется площадь?", ["см²", "см", "см³", "кг"], 0, "Площадь измеряется в квадратных единицах."], ["Стороны прямоугольника 9 см и 4 см. Найди площадь.", ["26 см²", "13 см²", "36 см²", "18 см²"], 2, "S = 9 · 4 = 36 см²."], ["Сторона квадрата 7 см. Найди площадь.", ["28 см²", "49 см²", "14 см²", "21 см²"], 1, "S = 7² = 49 см²."], ["Площадь прямоугольника 84 см², длина 12 см. Найди ширину.", ["6 см", "8 см", "9 см", "7 см"], 3, "84 : 12 = 7 см."], ["Площадь квадрата 121 см². Найди сторону.", ["11 см", "30,25 см", "12 см", "60,5 см"], 0, "a = √121 = 11 см."], ["Длина прямоугольника 1,5 дм, ширина 8 см. Найди площадь в см².", ["12 см²", "120 см²", "1200 см²", "23 см²"], 1, "1,5 дм = 15 см. S = 15 · 8 = 120 см²."], ["Периметр квадрата 36 см. Найди площадь.", ["36 см²", "144 см²", "81 см²", "9 см²"], 2, "Сторона равна 36 : 4 = 9 см. S = 9² = 81 см²."], ["Периметр прямоугольника 50 см, длина 15 см. Найди площадь.", ["150 см²", "525 см²", "75 см²", "250 см²"], 0, "Ширина равна 50 : 2 − 15 = 10 см. S = 15 · 10 = 150 см²."], ["Сторону квадрата увеличили в 3 раза. Во сколько раз увеличилась площадь?", ["В 3 раза", "В 6 раз", "В 12 раз", "В 9 раз"], 3, "S новая = (3a)² = 9a²."], ["У квадрата сторона 8 см. Прямоугольник имеет такой же периметр, а его длина 10 см. Чья площадь больше?", ["Прямоугольника на 4 см²", "Квадрата на 4 см²", "Площади равны", "Квадрата на 8 см²"], 1, "Периметр 32 см. Ширина прямоугольника 16 − 10 = 6 см. Площади: 64 и 60 см². Разность 4 см²."], ["Диагональ квадрата равна 10 см. Найди площадь.", ["100 см²", "25 см²", "50 см²", "20 см²"], 2, "По теореме Пифагора d² = 2a². Поэтому S = a² = 100 : 2 = 50 см²."], ["Из прямоугольника 12 × 9 см вырезали квадрат со стороной 4 см. Найди площадь оставшейся фигуры.", ["92 см²", "104 см²", "76 см²", "96 см²"], 0, "Площадь прямоугольника 108 см², квадрата 16 см². Осталось 108 − 16 = 92 см²."]];
let order=q.map((_,i)=>i), n=0, a={};const el=document.getElementById('quiz');
function node(tag,txt,cls,parent=el){const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;parent.append(e);return e;}
function explain(t,parent){node('h3','Разберёмся по шагам','',parent);const steps=t[3].split(/(?<=\.)\s+(?=[А-ЯЁA-Z√])|;\s*/).filter(Boolean);const list=node('ol','','',parent);steps.forEach(x=>node('li',x,'',list));}
function draw(){const idx=order[n],t=q[idx],v=a[idx];el.innerHTML=`<small>Задание ${idx+1} · ${n+1} из ${order.length}</small><div class="bar"><div class="fill" style="width:${(n+1)/order.length*100}%"></div></div>`;node('h2',t[0]);
if(idx===14){el.innerHTML+='<svg viewBox="0 0 320 210" role="img" aria-label="Прямоугольник 12 на 9 с вырезанным квадратом 4 на 4"><path d="M50 20H210V100H290V200H50Z" fill="#e1effa" stroke="#638db5" stroke-width="2"/><path d="M210 20H290V100" fill="none" stroke="#b99a55" stroke-dasharray="5 4"/><g fill="#244a70" font-size="13"><text x="155" y="195">12 см</text><text x="12" y="115">9 см</text><text x="234" y="15">4 см</text></g></svg>'}
t[1].forEach((s,i)=>{const b=node('button','АБВГ'[i]+'. '+s,'opt '+(v!==undefined?(i===t[2]?'good':i===v?'bad':''):''));b.disabled=v!==undefined;b.onclick=()=>{a[idx]=i;draw();};});
if(v!==undefined){const f=node('div','','feedback');f.setAttribute('role','status');node('strong',v===t[2]?'Верно!':'Пока неверно — посмотрим решение.','',f);node('p','Твой ответ: '+t[1][v],'',f);node('p','Правильный ответ: '+t[1][t[2]],'correct',f);explain(t,f);}
const nav=node('div','','nav');const back=node('button','Назад','',nav);back.disabled=n===0;back.onclick=()=>{n--;draw()};const next=node('button',n===order.length-1?'Результат':'Далее →','primary',nav);next.disabled=v===undefined;next.onclick=()=>{if(n+1<order.length){n++;draw()}else result()};}
function reset(ids){order=ids;n=0;a={};draw();}
function result(){const wrong=order.filter(i=>a[i]!==q[i][2]);el.replaceChildren();node('small','ТВОЙ РЕЗУЛЬТАТ');node('h1',`${order.length-wrong.length} из ${order.length}`);node('p',wrong.length?'Повтори задания, в которых ошибся.':'Отличная работа!');wrong.forEach(i=>{const f=node('div','','feedback');node('h3',`${i+1}. ${q[i][0]}`,'',f);node('p','Твой ответ: '+q[i][1][a[i]],'',f);node('p','Правильный ответ: '+q[i][1][q[i][2]],'correct',f);explain(q[i],f)});const nav=node('div','','nav');if(wrong.length)node('button','Повторить только ошибки','primary',nav).onclick=()=>reset(wrong);node('button','Пройти все 15 заново','',nav).onclick=()=>reset(q.map((_,i)=>i));}draw();
</script></html>
