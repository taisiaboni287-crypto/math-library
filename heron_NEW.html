<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Формула Герона</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f6fb;color:#203b58;font:17px system-ui}main{max-width:780px;margin:24px auto;padding:22px}header,section{background:white;border:1px solid #dce7f1;border-radius:24px;padding:26px;margin-bottom:18px}small{color:#587a9a}h1{font-size:clamp(25px,5vw,38px);margin:12px 0}h2{font-size:23px}button{font:inherit;cursor:pointer;border:1px solid #cbddeb;border-radius:12px;padding:14px;background:#f6faff;color:#203b58}button:hover{background:#e4eff9}button:disabled{cursor:default} .opt{display:block;width:100%;text-align:left;margin:9px 0}.good{background:#e0f3e8!important;border-color:#64a681}.bad{background:#fae7e5!important;border-color:#c88179}.primary{background:#244a70;color:white}.primary:disabled{opacity:.45}.bar{height:8px;background:#e4edf5;border-radius:8px;overflow:hidden}.fill{height:100%;background:#86afd1}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}#feedback{background:#edf5fc;border-radius:12px;padding:15px;margin-top:15px}svg{max-width:320px;width:100%;display:block;margin:12px auto}footer{text-align:center;color:#587a9a;font-size:13px}.feedback{background:#edf5fc;border:1px solid #d5e5f3;border-radius:14px;padding:18px;margin-top:16px;color:#203b58}.feedback p,.feedback li{line-height:1.65;margin:8px 0}.feedback h3{font-size:18px;margin:14px 0 8px}.correct{color:#286344;font-weight:600}.nav{flex-wrap:wrap}@media(max-width:480px){main{padding:10px;margin:8px auto}header,section{padding:16px}} </style><main><header><small>ПОНЯТНАЯ МАТЕМАТИКА · 8 КЛАСС</small><h1>Формула Герона</h1><small>15 заданий · от простого к сложному</small><svg viewBox="0 0 320 175" aria-label="Треугольник со сторонами a, b, c"><path d="M35 145H285L125 20Z" fill="#DFECF8" stroke="#638DB5" stroke-width="2"/><g fill="#203B58" font-size="18"><text x="160" y="166">a</text><text x="218" y="75">b</text><text x="62" y="75">c</text></g></svg></header><section id="quiz"></section><footer>Спокойно · по шагам · с результатом</footer></main><script>
const q=[["Что нужно знать для применения формулы Герона?", ["Три стороны", "Только высоту", "Только периметр", "Два угла"], 0, "Формула Герона позволяет найти площадь по трём сторонам. Высоту знать не требуется."], ["Как найти полупериметр?", ["a+b+c", "(a+b+c)/2", "abc/2", "(a+b)/2"], 1, "Сначала складываем все три стороны. Затем делим сумму на 2."], ["Выбери формулу Герона.", ["p(p−a)(p−b)(p−c)", "√(abc)", "√(p(p−a)(p−b)(p−c))", "p/2"], 2, "Под корнем находится произведение четырёх множителей: p, p−a, p−b, p−c."], ["Стороны 5, 6 и 7 см. Чему равен полупериметр?", ["18 см", "6 см", "12 см", "9 см"], 3, "P = 5 + 6 + 7 = 18 см. p = 18 : 2 = 9 см."], ["Для каких сторон нельзя применить формулу Герона для невырожденного треугольника?", ["3, 4, 8", "5, 5, 6", "3, 4, 5", "7, 8, 9"], 0, "Сумма двух меньших сторон должна быть больше третьей. Здесь 3 + 4 = 7 < 8, поэтому треугольник не существует."], ["Найди площадь треугольника со сторонами 3, 4, 5 см.", ["6 см²", "12 см²", "24 см²", "36 см²"], 0, "p = (3 + 4 + 5) : 2 = 6 см. S = √(6 · 3 · 2 · 1) = √36. S = 6 см²."], ["Найди площадь треугольника со сторонами 5, 5, 6 см.", ["10 см²", "12 см²", "15 см²", "24 см²"], 1, "p = (5 + 5 + 6) : 2 = 8 см. S = √(8 · 3 · 3 · 2) = √144. S = 12 см²."], ["Найди площадь треугольника со сторонами 5, 12, 13 см.", ["60 см²", "25 см²", "30 см²", "15 см²"], 2, "p = (5 + 12 + 13) : 2 = 15 см. S = √(15 · 10 · 3 · 2) = √900. S = 30 см²."], ["Найди площадь треугольника со сторонами 13, 14, 15 см.", ["42 см²", "90 см²", "168 см²", "84 см²"], 3, "p = (13 + 14 + 15) : 2 = 21 см. S = √(21 · 8 · 7 · 6) = √7056. S = 84 см²."], ["Найди площадь треугольника со сторонами 7, 8, 9 см.", ["12√5 см²", "24√5 см²", "60 см²", "36 см²"], 0, "p = (7 + 8 + 9) : 2 = 12 см. S = √(12 · 5 · 4 · 3) = √720. S = 12√5 см²."], ["Периметр равен 36 см, две стороны — 10 и 9 см. Найди площадь.", ["36 см²", "36√2 см²", "72 см²", "18√2 см²"], 0, "Третья сторона: 36 − 10 − 9 = 17 см. p = 36 : 2 = 18 см. S = √(18 · 8 · 9 · 1) = √1296 = 36 см²."], ["Стороны относятся как 3 : 4 : 5, периметр 48 см. Найди площадь.", ["48 см²", "192 см²", "96 см²", "24 см²"], 2, "Одна часть: 48 : (3 + 4 + 5) = 4 см. Стороны 12, 16, 20 см. p = 24 см. S = √(24 · 12 · 8 · 4) = √9216 = 96 см²."], ["Стороны равны 13, 14 и 15 см. Найди высоту к стороне 14 см.", ["6 см", "14 см", "7 см", "12 см"], 3, "p = 21 см. S = √(21 · 8 · 7 · 6) = 84 см². Из S = 14h : 2 получаем h = 168 : 14 = 12 см."], ["Стороны одного треугольника 3, 4, 5 см, другого — 6, 8, 10 см. Во сколько раз площадь второго больше?", ["4", "2", "8", "6"], 0, "Первый: p = 6, S = √(6 · 3 · 2 · 1) = 6 см². Второй: p = 12, S = √(12 · 6 · 4 · 2) = 24 см². Отношение 24 : 6 = 4."], ["Равнобедренный треугольник имеет периметр 50 см и основание 14 см. Найди площадь.", ["35√11 см²", "70√11 см²", "35 см²", "70 см²"], 0, "Боковые стороны: (50 − 14) : 2 = 18 см. p = 25 см. S = √(25 · 7 · 7 · 11) = 35√11 см²."]];
let order=q.map((_,i)=>i), n=0, a={};const el=document.getElementById('quiz');
function node(tag,txt,cls,parent=el){const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;parent.append(e);return e;}
function explain(t,parent){node('h3','Разберёмся по шагам','',parent);const steps=t[3].split(/(?<=\.)\s+(?=[А-ЯЁA-Z√])|;\s*/).filter(Boolean);const list=node('ol','','',parent);steps.forEach(x=>node('li',x,'',list));}
function draw(){const idx=order[n],t=q[idx],v=a[idx];el.innerHTML=`<small>Задание ${idx+1} · ${n+1} из ${order.length}</small><div class="bar"><div class="fill" style="width:${(n+1)/order.length*100}%"></div></div>`;node('small',idx<5?'Вспоминаем':idx<10?'Применяем':'Решаем сложные задачи');node('h2',t[0]);
t[1].forEach((s,i)=>{const b=node('button','АБВГ'[i]+'. '+s,'opt '+(v!==undefined?(i===t[2]?'good':i===v?'bad':''):''));b.disabled=v!==undefined;b.onclick=()=>{a[idx]=i;draw();};});
if(v!==undefined){const f=node('div','','feedback');f.setAttribute('role','status');node('strong',v===t[2]?'Верно!':'Пока неверно — посмотрим решение.','',f);node('p','Твой ответ: '+t[1][v],'',f);node('p','Правильный ответ: '+t[1][t[2]],'correct',f);explain(t,f);}
const nav=node('div','','nav');const back=node('button','Назад','',nav);back.disabled=n===0;back.onclick=()=>{n--;draw()};const next=node('button',n===order.length-1?'Результат':'Далее →','primary',nav);next.disabled=v===undefined;next.onclick=()=>{if(n+1<order.length){n++;draw()}else result()};}
function reset(ids){order=ids;n=0;a={};draw();}
function result(){const wrong=order.filter(i=>a[i]!==q[i][2]);el.replaceChildren();node('small','ТВОЙ РЕЗУЛЬТАТ');node('h1',`${order.length-wrong.length} из ${order.length}`);node('p',wrong.length?'Повтори задания, в которых ошибся.':'Отличная работа!');wrong.forEach(i=>{const f=node('div','','feedback');node('h3',`${i+1}. ${q[i][0]}`,'',f);node('p','Твой ответ: '+q[i][1][a[i]],'',f);node('p','Правильный ответ: '+q[i][1][q[i][2]],'correct',f);explain(q[i],f)});const nav=node('div','','nav');if(wrong.length)node('button','Повторить только ошибки','primary',nav).onclick=()=>reset(wrong);node('button','Пройти все 15 заново','',nav).onclick=()=>reset(q.map((_,i)=>i));}draw();
</script></html>
